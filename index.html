<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tom Harding Illustration</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400&family=Source+Sans+3:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { overflow-y: scroll; }

    .fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: #f7f5f2;
      text-align: center;
      padding: 3.5rem 1.5rem 1.9rem;
      --tile: 320px;
    }

    .fixed-header::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(var(--tile) / 10);
      transform: translateY(50%);
      background-image: url("WaveyLine.png");
      background-repeat: repeat-x;
      background-position: 0 center;
      background-size: var(--tile) 100%;
      animation: waveFlow 8.6s linear infinite;
      pointer-events: none;
    }

    @keyframes waveFlow {
      from { background-position-x: 0; }
      to   { background-position-x: calc(-1 * var(--tile)); }
    }

    /* Easter-egg boat: sails right-to-left across the wave every so often */
    .wave-boat {
      position: absolute;
      bottom: -24px;
      left: 100%;
      width: 60px;
      pointer-events: none;
      z-index: 1;
      animation: boatSail 120s linear infinite;
      animation-delay: 6s;
    }

    /* Only the boat itself is clickable; the wrapper stays click-through */
    .wave-boat a {
      display: block;
      width: 100%;
      pointer-events: auto;
      cursor: pointer;
    }

    .wave-boat img {
      display: block;
      width: 100%;
      height: auto;
      transform-origin: 50% 85%;
      animation: boatRock 4s ease-in-out infinite;
    }

    /* Travel: crosses the screen in 40s, then rests off-screen for the rest of the cycle */
    @keyframes boatSail {
      0%    { transform: translateX(0); }
      33.3% { transform: translateX(calc(-100vw - 96px)); }
      100%  { transform: translateX(calc(-100vw - 96px)); }
    }

    /* Rock: tilts ~17.5deg up one side, then up the other */
    @keyframes boatRock {
      0%, 100% { transform: rotate(-17.5deg); }
      50%      { transform: rotate(17.5deg); }
    }

    /* Soul fish: swim winding routes in the margins either side of the column.
       Each lane is the containing block, so the motion path resolves inside it. */
    .fish-lane {
      position: absolute;
      width: 230px;
      height: 110px;
      z-index: 0;
      pointer-events: none;
    }

    .fish-lane--left   { left: calc(50% - 410px - 250px); top: 42vh; }
    .fish-lane--right  { left: calc(50% + 410px + 20px);  top: 34vh; }
    .fish-lane--right2 { left: calc(50% + 410px + 40px);  top: 58vh; }

    .soul-fish {
      position: absolute;
      top: 0;
      left: 0;
      width: 32px;
      offset-rotate: 0deg;          /* stay upright; don't tumble along the curve */
      pointer-events: none;
      animation: fishSwim 36.8s ease-in-out infinite alternate;
      animation-delay: -14s;        /* stagger where each fish starts */
    }

    /* Only the linked fish is interactive */
    a.soul-fish { pointer-events: auto; cursor: pointer; }

    .soul-fish img {
      display: block;
      width: 100%;
      height: auto;
      /* steps(1) snaps the flip instantly instead of easing through it */
      animation: fishFlip 73.6s steps(1, end) infinite;
      animation-delay: -14s;
    }

    .fish-lane--left .soul-fish {
      offset-path: path("M 0,50 C 50,10 90,90 140,50 C 165,30 180,65 195,50");
    }
    /* Sets off rightward, so its flip phase is inverted */
    .fish-lane--left .soul-fish img { animation-name: fishFlipReverse; }

    .fish-lane--right .soul-fish {
      offset-path: path("M 195,45 C 145,5 105,85 55,45 C 30,25 15,60 0,45");
      animation-duration: 30.4s;
      animation-delay: -25s;
    }
    .fish-lane--right .soul-fish img {
      animation-duration: 60.8s;
      animation-delay: -25s;
    }

    .fish-lane--right2 .soul-fish {
      offset-path: path("M 185,40 C 140,75 95,10 55,45 C 30,65 15,25 0,40");
      animation-duration: 34s;
      animation-delay: -8s;
    }
    .fish-lane--right2 .soul-fish img {
      animation-duration: 68s;
      animation-delay: -8s;
    }

    @keyframes fishSwim {
      from { offset-distance: 0%; }
      to   { offset-distance: 100%; }
    }

    /* Instant flip at each turnaround. The art faces left, so fishFlip suits a
       fish that sets off leftward; the left fish sets off rightward, so it uses
       the inverted phase. */
    @keyframes fishFlip {
      0%   { transform: scaleX(1); }
      50%  { transform: scaleX(-1); }
      100% { transform: scaleX(1); }
    }

    @keyframes fishFlipReverse {
      0%   { transform: scaleX(-1); }
      50%  { transform: scaleX(1); }
      100% { transform: scaleX(-1); }
    }

    /* Below ~1320px there are no side margins, so anchor the lanes to the
       viewport edges instead of the column, with shorter paths. Lane width is
       set to the exact path extent (path width + fish width) so the fish can
       never swim past the screen edge. */
    @media (max-width: 1320px) {
      .fish-lane { width: 161px; height: 90px; }

      .fish-lane--left   { left: 2vw;  right: auto; top: 30vh; }
      .fish-lane--right  { left: auto; right: 2vw;  top: 48vh; }
      .fish-lane--right2 { left: auto; right: 2vw;  top: 66vh; }

      .soul-fish { width: 26px; }

      .fish-lane--left .soul-fish {
        offset-path: path("M 0,45 C 30,12 60,78 90,45 C 108,28 122,58 135,45");
      }
      .fish-lane--right .soul-fish {
        offset-path: path("M 135,40 C 105,7 75,73 45,40 C 27,22 13,52 0,40");
      }
      .fish-lane--right2 .soul-fish {
        offset-path: path("M 135,40 C 100,70 65,10 35,45 C 22,58 10,25 0,40");
      }
    }

    .contact-link {
      position: absolute;
      top: 3.5rem;
      right: 8.4rem;
      color: #000;
      text-decoration: none;
      transition: opacity 0.2s ease;
      font-size: 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .contact-link:hover { opacity: 0.45; }

    .contact-link img {
      display: block;
      width: 94px;
      height: auto;
    }

    body {
      background: #f7f5f2;
      color: #000;
      font-family: 'Libre Baskerville', serif;
      font-weight: 300;
      min-height: 100vh;
      padding: 1.5rem 1.5rem 2rem;
      text-align: center;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      min-height: calc(100vh - 3.5rem);
      display: flex;
      flex-direction: column;
      justify-content: safe center;
      padding-top: 11.5rem;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards;
      animation-delay: 0.2s;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .title {
      font-family: 'Libre Baskerville', serif;
      font-weight: 400;
      font-size: clamp(1.045rem, 3.29vw, 2.17rem);
      letter-spacing: 0.01em;
      line-height: 1.15;
      color: #000;
    }

    .spacer {
      margin-top: 0.44rem;
    }

    .dot-divider {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.8rem;
      padding: 0.7rem 0;
      font-size: 1.8rem;
    }

    .dot-divider span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #000;
      display: block;
    }

    .portfolio {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.44rem;
    }

    .portfolio li {
      opacity: 0;
      animation: fadeUp 0.7s ease forwards;
    }
    .portfolio li:nth-child(1) { animation-delay: 0.5s; }
    .portfolio li:nth-child(2) { animation-delay: 0.65s; }
    .portfolio li:nth-child(3) { animation-delay: 0.8s; }

    .portfolio-btn {
      display: block;
      width: 100%;
      padding: 1.2rem 0;
      background: none;
      border: none;
      cursor: pointer;
      color: #000;
      font-family: 'Libre Baskerville', serif;
      font-size: clamp(0.9rem, 2.5vw, 1.5rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      text-align: center;
      transition: opacity 0.2s ease;
    }

    .portfolio-btn:hover { opacity: 0.55; }

    .embed-panel {
      display: none;
      padding: 0.75rem 0 1.25rem;
    }

    .embed-panel.open {
      display: block;
      position: relative;
      width: min(1200px, 94vw);
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;                 /* sit above the swimming fish when expanded */
      background: #f7f5f2;
    }

    .pdf-wrapper {
      position: relative;
    }

    .pdf-frame {
      width: 100%;
      height: 70vh;
      border: 1px solid #d8d5d0;
      border-radius: 4px;
      background: #fff;
      display: block;
    }

    .fullscreen-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255,255,255,0.9);
      border: 1px solid #d8d5d0;
      border-radius: 4px;
      padding: 5px 9px;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      color: #000;
      font-family: 'Libre Baskerville', serif;
      transition: background 0.2s;
    }

    .fullscreen-btn:hover { background: #fff; }

    .video-wrap {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #d8d5d0;
    }

    .video-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    footer {
      margin-top: 1.25rem;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: #aaa;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      body { padding: 1rem 1rem 3rem; }
      .container { padding-top: 6rem; }
      .fixed-header { padding: 1.2rem 1rem 1rem; }
      .pdf-frame { height: 55vh; }
      .contact-link { top: 1.2rem; right: 1.2rem; }
    }
  </style>
</head>
<body>
<header class="fixed-header">
    <a class="contact-link" href="mailto:tom@tomhardingillustration.co.uk">
      <img src="MailImage1.png" alt="Email Tom Harding">
    </a>
    <h1 class="title">Tom Harding<br>Art &amp; Illustration</h1>
    <div class="wave-boat"><a href="boatimage20072026.jpeg" target="_blank" rel="noopener" aria-label="Open drawing"><img src="boat.png" alt=""></a></div>
  </header>

  <div class="container">
    <div class="spacer"></div>

    <ul class="portfolio">

      <li>
        <button class="portfolio-btn" onclick="toggle(this, 'illustration')">
          Illustration Portfolio
        </button>
      </li>

      <div class="dot-divider">
        <img src="handDrawing1v2.png" alt="hand drawing" onclick="toggleById('illustration')" style="width:10rem;height:auto;cursor:pointer;">
      </div>
      <div class="embed-panel" id="illustration">
        <div class="pdf-wrapper">
          <iframe class="pdf-frame" id="frame-illustration" data-pdf="ArtAndIllustrationFolio.pdf" title="Art & Illustration Portfolio"></iframe>
          <button class="fullscreen-btn" onclick="openFullscreen('frame-illustration', 'ArtAndIllustrationFolio.pdf')">⤢ Full Screen</button>
        </div>
      </div>

      <li>
        <button class="portfolio-btn" onclick="toggle(this, 'game-art')">
          Experimental Portfolio
        </button>
      </li>

      <div class="dot-divider">
        <img src="experimentallogov1.png" alt="experimental logo" onclick="toggleById('game-art')" style="width:8.7rem;height:auto;cursor:pointer;">
      </div>
      <div class="embed-panel" id="game-art">
        <div class="pdf-wrapper">
          <iframe class="pdf-frame" id="frame-game-art" data-pdf="ExperimentalFolio1.pdf" title="Experimental Portfolio"></iframe>
          <button class="fullscreen-btn" onclick="openFullscreen('frame-game-art', 'ExperimentalFolio1.pdf')">⤢ Full Screen</button>
        </div>
      </div>

      <li>
        <button class="portfolio-btn" onclick="toggle(this, 'showreel')">
          Game Art Show Reel
        </button>
        <div class="dot-divider">
          <img src="handsgamecontroller1v2.png" alt="game controller" onclick="toggleById('showreel')" style="width:8.7rem;height:auto;cursor:pointer;">
        </div>
        <div class="embed-panel" id="showreel">
          <div class="video-wrap">
            <iframe src="https://www.youtube.com/embed/frCgh0a3msg" title="Show Reel" allowfullscreen></iframe>
          </div>
        </div>
      </li>

    </ul>

    <footer>© 2026 Tom Harding</footer>
  </div>

  <div class="fish-lane fish-lane--left">
    <a class="soul-fish" href="https://www.youtube.com/watch?v=3yz73QUttMU" target="_blank" rel="noopener" aria-label="Soul fish video">
      <img src="SoulFishSwimming.png" alt="">
    </a>
  </div>
  <div class="fish-lane fish-lane--right">
    <a class="soul-fish" href="https://www.youtube.com/shorts/GI1-x4V5DaE" target="_blank" rel="noopener" aria-label="Soul fish video">
      <img src="SoulFishSwimming.png" alt="">
    </a>
  </div>
  <div class="fish-lane fish-lane--right2">
    <a class="soul-fish" href="https://www.youtube.com/shorts/NLju3teaDxk" target="_blank" rel="noopener" aria-label="Soul fish video">
      <img src="SoulFishSwimming.png" alt="">
    </a>
  </div>

  <script>
    const isMobile = window.innerWidth <= 768;
    const baseUrl = window.location.href.replace(/\/[^/]*$/, '/');

    function getPdfSrc(filename) {
      if (isMobile) {
        return 'https://docs.google.com/viewer?url=' + encodeURIComponent(baseUrl + filename) + '&embedded=true';
      }
      return filename;
    }

    function scrollPanelBelowHeader(panel) {
      const header = document.querySelector('.fixed-header');
      const offset = header.offsetHeight + 12;
      const top = panel.getBoundingClientRect().top + window.pageYOffset - offset;
      window.scrollTo({ top, behavior: 'smooth' });
    }

    function toggleById(id) {
      const panel = document.getElementById(id);
      const isOpen = panel.classList.contains('open');
      document.querySelectorAll('.embed-panel').forEach(p => p.classList.remove('open'));
      if (!isOpen) {
        panel.classList.add('open');
        const frame = panel.querySelector('iframe[data-pdf]');
        if (frame && !frame.src) {
          frame.src = getPdfSrc(frame.getAttribute('data-pdf'));
        }
        setTimeout(() => scrollPanelBelowHeader(panel), 50);
      }
    }

    function toggle(btn, id) {
      const panel = document.getElementById(id);
      const isOpen = panel.classList.contains('open');

      document.querySelectorAll('.embed-panel').forEach(p => p.classList.remove('open'));

      if (!isOpen) {
        panel.classList.add('open');
        const frame = panel.querySelector('iframe[data-pdf]');
        if (frame && !frame.src) {
          frame.src = getPdfSrc(frame.getAttribute('data-pdf'));
        }
        setTimeout(() => scrollPanelBelowHeader(panel), 50);
      }
    }

    function openFullscreen(frameId, pdfSrc) {
      const frame = document.getElementById(frameId);
      if (frame.requestFullscreen) {
        frame.requestFullscreen();
      } else if (frame.webkitRequestFullscreen) {
        frame.webkitRequestFullscreen();
      } else {
        window.open(pdfSrc, '_blank');
      }
    }

    // Click anywhere outside an open panel (and not on a toggle control) closes all panels.
    document.addEventListener('click', function(e) {
      if (e.target.closest('.embed-panel') ||
          e.target.closest('.portfolio-btn') ||
          e.target.closest('.dot-divider')) {
        return;
      }
      document.querySelectorAll('.embed-panel').forEach(p => p.classList.remove('open'));
    });
  </script>
</body>
</html>
