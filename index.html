    /* Wave line, grid and skyline: hand-drawn lines traced to SVG paths, so the
       line thickness is a setting (the --*-line values above) */
    .drawn-line {
      fill: none;
      stroke: #000;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: transparent;   /* let the wavy water edge define the boundary */
      text-align: center;
      padding: 3.5rem 1.5rem 1.9rem;
      pointer-events: none;      /* boxes up under the header stay clickable */
    }
    .fixed-header .contact-link, .fixed-header .phone-contact { pointer-events: auto; }

    /* Wave line: its own fixed layer the height of the header (so
       they sit where they did at its bottom edge), under the boxes
       (.container, the same z-index but later in the page) while the
       header's title, mail and phone stay on top */
    .waterline-layer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-bottom, 160px);
      z-index: 2;
      pointer-events: none;
      --tile: var(--wave-tile);
    }

    /* Wavy line along the header's bottom edge (the waterline layer's), raised by --wave-raise. The
       --tile x 32 tile (setWaveRepeat() stretches the drawn 320) sits in the
       middle of a 64px band so thick lines aren't clipped; the strip is one
       tile wider than the screen and slides one tile left, then repeats. */
    .wave-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64px;
      transform: translateY(calc(50% - var(--wave-raise)));
      overflow: hidden;
      pointer-events: none;
    }
    .wave-line svg {
      display: block;
      width: calc(100% + var(--tile));
      height: 100%;
      animation: waveFlow 8.6s linear infinite;
    }
    .wave-line .drawn-line { stroke-width: var(--wave-line); stroke: var(--wave-line-colour); }

    @keyframes waveFlow {
      from { transform: translateX(0); }
      to   { transform: translateX(calc(-1 * var(--tile))); }
    }

    /* Boat layer: same place as the waterline layer, but BEHIND the water
       (earlier in the page at the water's z-index), so the waves pass in front */
    .boat-layer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-bottom, 160px);
      z-index: 0;
      pointer-events: none;
    }

    /* Easter-egg boat: sails right-to-left across the wave every so often */
    .wave-boat {
      position: absolute;
      bottom: calc(-24px + var(--wave-raise) + var(--boat-raise));
      left: 100%;
      width: var(--boat-size);
      pointer-events: none;
      z-index: 1;
      animation: boatSail 120s linear infinite;
      animation-delay: 6s;
    }

    /* Only the boat itself is clickable; the wrapper stays click-through */
    .wave-boat a {
      display: block;
      width: 100%;
      pointer-events: auto;
      cursor: pointer;
    }

    .wave-boat img {
      display: block;
      width: 100%;
      height: auto;
      transform-origin: 50% 85%;
      animation: boatRock 4s ease-in-out infinite;
    }

    /* Travel: crosses the screen in 40s, then rests off-screen for the rest of the cycle */
    @keyframes boatSail {
      0%    { transform: translateX(0); }
      33.3% { transform: translateX(calc(-100vw - 96px)); }
      100%  { transform: translateX(calc(-100vw - 96px)); }
    }

    /* Rock: tilts ~17.5deg up one side, then up the other */
    @keyframes boatRock {
      0%, 100% { transform: rotate(-17.5deg); }
      50%      { transform: rotate(17.5deg); }
    }

    /* Soul fish: swim winding routes in the margins either side of the column.
       Each lane is the containing block, so the motion path resolves inside it. */
    .fish-lane {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      transition: transform 2.2s ease, opacity 2.2s ease;
    }

    /* When the viewer is open the fish disperse off-screen, and return on close */
    body.panel-open .fish-lane--left  { transform: translateX(-75vw); opacity: 0; }
    body.panel-open .fish-lane--right,
    body.panel-open .fish-lane--right2 { transform: translateX(75vw); opacity: 0; }

    /* Swimming areas (setFishAreas() stretches each swim path to its area) */
    .fish-lane--left   { left: calc(50% + var(--fish-left-x));   top: var(--fish-left-y);   width: var(--fish-left-width);   height: var(--fish-left-height); }
    .fish-lane--right  { left: calc(50% + var(--fish-right-x));  top: var(--fish-right-y);  width: var(--fish-right-width);  height: var(--fish-right-height); }
    .fish-lane--right2 { left: calc(50% + var(--fish-right2-x)); top: var(--fish-right2-y); width: var(--fish-right2-width); height: var(--fish-right2-height); }

    .soul-fish {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--fish-size);
      offset-rotate: 0deg;          /* stay upright; don't tumble along the curve */
      pointer-events: none;
      animation: fishSwim 36.8s ease-in-out infinite alternate;
      animation-delay: -14s;        /* stagger where each fish starts */
    }

    /* Only the linked fish is interactive */
    a.soul-fish { pointer-events: auto; cursor: pointer; }

    .soul-fish img {
      display: block;
      width: 100%;
      height: auto;
      /* steps(1) snaps the flip instantly instead of easing through it */
      animation: fishFlip 73.6s steps(1, end) infinite;
      animation-delay: -14s;
    }

    .fish-lane--left .soul-fish {
      offset-path: path("M 0,50 C 50,10 90,90 140,50 C 165,30 180,65 195,50");
    }
    /* Sets off rightward, so its flip phase is inverted */
    .fish-lane--left .soul-fish img { animation-name: fishFlipReverse; }

    .fish-lane--right .soul-fish {
      offset-path: path("M 195,45 C 145,5 105,85 55,45 C 30,25 15,60 0,45");
      animation-duration: 30.4s;
      animation-delay: -25s;
    }
    .fish-lane--right .soul-fish img {
      animation-duration: 60.8s;
      animation-delay: -25s;
    }

    .fish-lane--right2 .soul-fish {
      offset-path: path("M 185,40 C 140,75 95,10 55,45 C 30,65 15,25 0,40");
      animation-duration: 34s;
      animation-delay: -8s;
    }
    .fish-lane--right2 .soul-fish img {
      animation-duration: 68s;
      animation-delay: -8s;
    }

    /* Fish / boat fill: the img's own picture is pushed out of its box and its
       background, masked by that same PNG (--fill-png, set in JS), shows the
       shape in --fish-colour / --boat-colour. Each is off while transparent. */
    .fish-coloured .soul-fish img,
    .boat-coloured .wave-boat img {
      object-position: 0 -100000px;
      -webkit-mask: var(--fill-png) center / contain no-repeat;
      mask: var(--fill-png) center / contain no-repeat;
    }
    .fish-coloured .soul-fish img { background: var(--fish-colour); }
    .boat-coloured .wave-boat img { background: var(--boat-colour); }

    @keyframes fishSwim {
      from { offset-distance: 0%; }
      to   { offset-distance: 100%; }
    }

    /* Instant flip at each turnaround. The art faces left, so fishFlip suits a
       fish that sets off leftward; the left fish sets off rightward, so it uses
       the inverted phase. */
    @keyframes fishFlip {
      0%   { transform: scaleX(1); }
      50%  { transform: scaleX(-1); }
      100% { transform: scaleX(1); }
    }

    @keyframes fishFlipReverse {
      0%   { transform: scaleX(-1); }
      50%  { transform: scaleX(1); }
      100% { transform: scaleX(-1); }
    }

    /* Below ~1320px there are no side margins, so anchor the lanes to the
       viewport edges instead of the column, with shorter paths. Lane width is
       set to the exact path extent (path width + fish width) so the fish can
       never swim past the screen edge. */
    @media (max-width: 1320px) {
      .fish-lane--left   { left: var(--fish-left-x-phone); right: auto; top: var(--fish-left-y-phone);
                           width: var(--fish-left-width-phone); height: var(--fish-left-height-phone); }
      .fish-lane--right  { left: auto; right: var(--fish-right-x-phone);  top: var(--fish-right-y-phone);
                           width: var(--fish-right-width-phone); height: var(--fish-right-height-phone); }
      .fish-lane--right2 { left: auto; right: var(--fish-right2-x-phone); top: var(--fish-right2-y-phone);
                           width: var(--fish-right2-width-phone); height: var(--fish-right2-height-phone); }

      .soul-fish { width: var(--fish-size-phone); }

      .fish-lane--left .soul-fish {
        offset-path: path("M 0,45 C 30,12 60,78 90,45 C 108,28 122,58 135,45");
      }
      .fish-lane--right .soul-fish {
        offset-path: path("M 135,40 C 105,7 75,73 45,40 C 27,22 13,52 0,40");
      }
      .fish-lane--right2 .soul-fish {
        offset-path: path("M 135,40 C 100,70 65,10 35,45 C 22,58 10,25 0,40");
      }
    }

    .contact-link {
      position: absolute;
      top: calc(3.5rem - var(--mail-offset));
      right: 8.4rem;
      z-index: 2;                 /* mail hand in front of the wave (the boat is behind the water) */
      color: #000;
      text-decoration: none;
      font-size: 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    /* Under the mouse the white fill turns --contact-hover-colour (the fill span
       sits over the white PNG, so this shows whether or not that's coloured) */
    .contact-link:hover .pbox-white-fill { background: var(--contact-hover-colour); }

    /* Three-part mail hand like the box logos: white fill, shading, linework */
    .contact-icon {
      display: block;
      position: relative;
      width: var(--mail-size);
      aspect-ratio: 716 / 980;
    }
    .contact-icon img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .contact-icon img:nth-of-type(2) { opacity: 0.5; }   /* shading layer */

    /* Phone: mirrors the mail hand on the left; calls --phone-number.
       Phones dial straight away; computers open the card underneath. */
    .phone-contact {
      position: absolute;
      top: calc(3.5rem - var(--phone-offset));
      left: 8.4rem;
      z-index: 2;
    }
    .phone-contact .contact-link { position: static; }

    /* While the viewer is open the mail hand and phone shift by their preview
       offsets, on top of the normal ones; they glide there with the boxes' timing */
    .fixed-header > .contact-link { --open-x: var(--mail-open-x);  --open-y: var(--mail-open-y); }
    .phone-contact                { --open-x: var(--phone-open-x); --open-y: var(--phone-open-y); }
    .fixed-header > .contact-link,
    .phone-contact { translate: 0 0; transition: translate .6s cubic-bezier(.6,.05,.25,1); }
    body.panel-open .fixed-header > .contact-link,
    body.panel-open .phone-contact { translate: var(--open-x) calc(-1 * var(--open-y)); }
    .phone-contact .contact-icon { width: var(--phone-size); aspect-ratio: 594 / 1044; }
    .phone-card {
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.7rem 0.9rem;
      background: var(--box-colour);
      border: var(--box-line) solid var(--box-line-colour);
      border-radius: var(--box-corner);
      color: var(--box-text-colour);
      font-size: 1.3rem;
      white-space: nowrap;
      text-align: left;
    }
    .phone-card[hidden] { display: none; }
    .phone-card-number { user-select: all; }
    .phone-card-actions { display: flex; gap: 0.5rem; }
    .phone-card-actions a,
    .phone-card-actions button {
      flex: 1;
      padding: 0.25rem 0.7rem;
      font: inherit;
      font-size: 1.1rem;
      color: inherit;
      text-align: center;
      text-decoration: none;
      background: transparent;
      border: 2px solid var(--box-line-colour);
      border-radius: calc(var(--box-corner) / 2);
      cursor: pointer;
    }
    .phone-card-actions a:hover,
    .phone-card-actions button:hover { background: var(--box-hover-colour); }

    body {
      background: var(--page-colour);
      color: #000;
      font-family: 'NomKabarFont2', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      padding: 1.5rem 1.5rem 2rem;
      text-align: center;
      transition: background-color 0.35s ease;
    }
    /* Night (viewer's own clock, 7pm-7am): setDayNight() puts is-night on <html>. */
    .is-night body { background: var(--page-night-colour); }

    /* Permanent "water": darker shade + repeating grid, always present below the
       wavy line. Masked to a wavy top edge; the opaque header covers the rest. */
    .water {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-color: var(--water-colour);
      -webkit-mask-image: url("UnderWavesMaskImg.png"), linear-gradient(#000, #000);
      mask-image: url("UnderWavesMaskImg.png"), linear-gradient(#000, #000);
      /* The edge tile scales up and down with the wave (--wave-scale = repeat / 320,
         set by setWaveRepeat()) about the wave's middle, 12px below --waterline */
      --edge-top: calc(var(--waterline) + 12px - 12px * var(--wave-scale, 1));
      --edge-solid: calc(var(--waterline) + 12px + 18px * var(--wave-scale, 1));
      -webkit-mask-size: var(--wave-tile) calc(32px * var(--wave-scale, 1)), 100% 300vh;
      mask-size: var(--wave-tile) calc(32px * var(--wave-scale, 1)), 100% 300vh;
      -webkit-mask-repeat: repeat-x, no-repeat;
      mask-repeat: repeat-x, no-repeat;
      -webkit-mask-position: 0 var(--edge-top), 0 var(--edge-solid);
      mask-position: 0 var(--edge-top), 0 var(--edge-solid);
      /* Scroll the wavy edge one tile in sync with the wave line (same --wave-tile / 8.6s) */
      animation: waterFlow 8.6s linear infinite;
    }

    @keyframes waterFlow {
      from {
        -webkit-mask-position: 0 var(--edge-top), 0 var(--edge-solid);
        mask-position: 0 var(--edge-top), 0 var(--edge-solid);
      }
      to {
        -webkit-mask-position: calc(-1 * var(--wave-tile)) var(--edge-top), 0 var(--edge-solid);
        mask-position: calc(-1 * var(--wave-tile)) var(--edge-top), 0 var(--edge-solid);
      }
    }

    /* Repeating grid tile over the water colour (drawn 148px; setGridRepeat() scales it to --grid-tile) */
    .water svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .water .drawn-line { stroke-width: var(--grid-line); stroke: var(--grid-line-colour); }

    /* City skyline above the waves, mirrored about the title */
    .skyline {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(var(--waterline) + 32px);
      z-index: 0;
      pointer-events: none;
    }
    /* Steps drawn by setSkyline() in px over the whole layer. Both layers run
       down past the wavy water edge so steps can go below the skyline ground;
       --sky-drop = the ground's 30px lift above the waterline + the 32px wave edge */
    .skyline {
      --sky-drop: 62px;
      --sky-line: var(--skyline-line);
      --sky-step-width: var(--skyline-step-width);
      --sky-step-height: var(--skyline-step-height);
      --sky-nodes: var(--skyline-nodes);
      --sky-mirror: var(--skyline-mirror);
      --sky-pattern: var(--skyline-pattern);
      --sky-l-spacing: var(--skyline-lights-spacing);
      --sky-l-amount: var(--skyline-lights-amount);
      --sky-l-size: var(--skyline-lights-size);
      --sky-l-size-var: var(--skyline-lights-size-variation);
      --sky-l-depth: var(--skyline-lights-depth);
      --sky-l-fade: var(--skyline-lights-fade);
      --sky-l-roof: var(--skyline-lights-roof);
      --sky-l-wall: var(--skyline-lights-wall);
      --sky-l-rows: var(--skyline-lights-rows);
      --sky-l-row-length: var(--skyline-lights-row-length);
      --sky-l-jitter: var(--skyline-lights-jitter);
      --sky-l-flicker: var(--skyline-lights-flicker);
    }
    /* Skyline lights: window dots drawn by setSkyline() in the fill layer
       (so the water covers any that reach it); shown only at night */
    .sky-lights { display: none; }
    .is-night .sky-lights { display: inline; }
    .sky-lights circle { fill: var(--skyline-lights-colour); }
    .sky-lights .twinkle { animation: skyTwinkle 4s ease-in-out infinite; }
    @keyframes skyTwinkle {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.2; }
    }
    .skyline svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .skyline .drawn-line { stroke-width: var(--sky-line); stroke: var(--skyline-colour); }
    /* Skyline fill: the same steps closed off underneath, on its own layer behind
       the water so it runs down under the wavy edge */
    .skyline-fill path { fill: var(--skyline-fill-colour); }

    /* Clouds: the traced cloud line (461 x 297 as drawn) repeating across,
       filled down behind the city. They sit first in the skyline fill layer
       so the skyline covers them. setClouds() bends the drawing along
       --cloud-node-list over the whole layer: each part of it is scaled by
       --cloud-tile + the nodes' scale +/- there and raised by their height
       (coordinates, so the line keeps its thickness). The drawing's bottom
       sits where the skyline ground would be with --cloud-raise as its
       height (--cloud-ground, set in JS). */
    .skyline .clouds {
      --cloud-tile: var(--cloud-scale);
      --cloud-stroke: var(--cloud-line);
      --cloud-node-list: var(--cloud-nodes);
    }
    .skyline .clouds .cloud-fill { fill: var(--cloud-fill-colour); }
    .skyline .clouds .drawn-line { fill: none; stroke: var(--cloud-colour); stroke-width: var(--cloud-stroke); }

    .container {
      position: relative;
      z-index: 2;                 /* boxes in front of the wave line */
      pointer-events: none;       /* only the boxes and viewer catch clicks, so the boat stays clickable */
      max-width: 1120px;
      margin: 0 auto;
      min-height: calc(100vh - 3.5rem);
      padding-top: 11.5rem;
      /* backwards: hidden through the delay, then nothing left over once it
         ends, so position: fixed children (phone icon row, viewer, footer)
         sit against the window rather than the container */
      animation: fadeUp 0.9s ease 0.2s backwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .title {
      font-family: 'NomKabarFont2', sans-serif;
      font-weight: 400;
      font-size: clamp(var(--title-size-small), 3.29vw, var(--title-size-large));
      letter-spacing: 0.01em;
      line-height: 1.15;
      color: var(--title-colour);
      /* Outline drawn behind the fill, so the stroke is doubled to show at full width */
      --t-outline: var(--title-outline);
      -webkit-text-stroke: calc(var(--t-outline) * 2) var(--title-outline-colour);
      paint-order: stroke fill;
      /* Title offset: relative, so only the text moves (the header, and the
         waterline / skyline / clouds measured from it, stay put) */
      --t-offset: var(--title-offset);
      position: relative;
      top: calc(-1 * var(--t-offset));
      pointer-events: auto;       /* clicking it leaves the viewer */
    }

    /* ---- Floating portfolio boxes ---- */
    .pboxes {
      position: relative;
      height: 70vh;
      max-height: 660px;
    }

    .pbox {
      position: absolute;
      width: calc(185px * var(--box-scale) * var(--own-scale, 1));
      height: calc(172px * var(--box-scale) * var(--own-scale, 1));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: var(--box-padding);
      background: var(--box-colour);
      border: var(--box-line) solid var(--box-line-colour);
      border-radius: var(--box-corner);
      cursor: pointer;
      color: var(--box-text-colour);
      font-family: 'NomKabarFont2', sans-serif;
      z-index: 3;
      pointer-events: auto;
      /* float disabled 2026-09-22 — see disabled-effects/floating-boxes.css */
      transition: left .6s cubic-bezier(.6,.05,.25,1),
                  top .6s cubic-bezier(.6,.05,.25,1),
                  width .6s cubic-bezier(.6,.05,.25,1),
                  height .6s cubic-bezier(.6,.05,.25,1),
                  box-shadow .3s ease, border-color .3s ease;
    }

    .pbox:hover { background: var(--box-hover-colour); }

    .pbox-title {
      font-size: var(--button-text);
      letter-spacing: 0.01em;
      text-align: center;
      transition: opacity .3s ease;
      pointer-events: none;
    }

    .pbox-icon {
      display: block;
      position: relative;
      width: var(--logo-size);
      aspect-ratio: 492 / 372;   /* the old single-image icons' canvas */
      pointer-events: none;
      transition: width .6s cubic-bezier(.6,.05,.25,1);
    }
    /* Three-part logos: white bg, shading, linework stacked in that order */
    .pbox-icon img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .pbox-icon img:nth-of-type(2) { opacity: 0.5; }   /* shading layer */
    /* Shading colour fill: the shading PNG's shape filled with --logo-shading-colour
       (span added after each shading img in JS). Off while that colour is transparent. */
    .pbox-shading-fill {
      position: absolute;
      inset: 0;
      background: var(--logo-shading-colour);
      -webkit-mask: var(--shading-png) center / contain no-repeat;
      mask: var(--shading-png) center / contain no-repeat;
    }
    .shading-coloured .pbox-icon img:nth-of-type(2),
    .shading-coloured .contact-icon img:nth-of-type(2) { opacity: 0; }   /* the fill replaces the grey shading */
    /* White fill colour: same idea for the white bg PNG, filled with --logo-white-colour */
    .pbox-white-fill {
      position: absolute;
      inset: 0;
      background: var(--logo-white-colour);
      -webkit-mask: var(--white-png) center / contain no-repeat;
      mask: var(--white-png) center / contain no-repeat;
    }
    .white-coloured .pbox-icon img:nth-of-type(1),
    .white-coloured .contact-icon img:nth-of-type(1) { opacity: 0; }   /* the fill replaces the white */

    /* Resting: placed by the --box-*-x / -y values (x = box centre, y = box top), sized by its own --box-*-scale */
    .pbox--illustration  { --own-scale: var(--box-illustration-scale); --own-scale-phone: var(--box-illustration-scale-phone); left: calc(var(--box-illustration-x) - 92px * var(--box-scale) * var(--own-scale));  top: var(--box-illustration-y); }
    .pbox--experimental  { --own-scale: var(--box-experimental-scale); --own-scale-phone: var(--box-experimental-scale-phone); left: calc(var(--box-experimental-x) - 92px * var(--box-scale) * var(--own-scale));  top: var(--box-experimental-y); }
    .pbox--storyboarding { --own-scale: var(--box-storyboarding-scale); --own-scale-phone: var(--box-storyboarding-scale-phone); left: calc(var(--box-storyboarding-x) - 92px * var(--box-scale) * var(--own-scale)); top: var(--box-storyboarding-y); }
    .pbox--showreel      { --own-scale: var(--box-showreel-scale); --own-scale-phone: var(--box-showreel-scale-phone); left: calc(var(--box-showreel-x) - 92px * var(--box-scale) * var(--own-scale));      top: var(--box-showreel-y); }
    .pbox--drawings      { --own-scale: var(--box-drawings-scale); --own-scale-phone: var(--box-drawings-scale-phone); left: calc(var(--box-drawings-x) - 92px * var(--box-scale) * var(--own-scale));      top: var(--box-drawings-y); }

    /* ---- Open state: boxes tighten to icons and dock left, viewer opens ---- */
    .container.is-open .pbox {
      width: 152px;
      height: 112px;
      gap: 0;
      animation: none;
      transform: none;
    }
    /* Collapse the title out of flow so the icon centres */
    .container.is-open .pbox-title { opacity: 0; height: 0; margin: 0; overflow: hidden; }
    .container.is-open .pbox-icon { width: var(--logo-size-open); }

    .container.is-open .pbox--illustration  { left: 0; top: 1%; }
    .container.is-open .pbox--experimental  { left: 0; top: 20.5%; }
    .container.is-open .pbox--storyboarding { left: 0; top: 40%; }
    .container.is-open .pbox--showreel      { left: 0; top: 59.5%; }
    .container.is-open .pbox--drawings      { left: 0; top: 79%; }

    .pbox.is-active { background: var(--box-active-colour); }

    /* ---- Viewer panel ---- */
    .viewer {
      position: absolute;
      top: 1%;
      left: 172px;
      /* Viewer width; it can reach past the content area but stops 16px short of the window edge */
      width: var(--viewer-width);
      max-width: calc(100% - 172px + max(0px, (100vw - 1120px) / 2 - 16px));
      height: calc(70vh - 14px);
      max-height: 650px;
      background: var(--viewer-colour);
      border: var(--viewer-line) solid var(--viewer-line-colour);
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none;
      transition: opacity .4s ease, transform .4s ease;
      z-index: 120;               /* above the fixed header so the outside-X shows */
    }
    .container.is-open .viewer {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .viewer-body { width: 100%; height: 100%; overflow: hidden; }
    .viewer-body .pdf-frame { width: 100%; height: 100%; border: none; border-radius: 0; }

    /* Drawings: a self-contained vertical scroll area of images */
    .viewer-body .gallery {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--gallery-colour);
      padding: 14px;
      text-align: center;
    }
    .viewer-body .gallery img {
      display: block;
      width: 100%;
      max-width: 640px;
      height: auto;
      margin: 0 auto 14px;
      /* Images can't be right-clicked, dragged out or long-pressed to save:
         clicks pass through to the gallery behind them */
      pointer-events: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
    }
    .viewer-body .gallery img:last-child { margin-bottom: 0; }
    .viewer-body .video-wrap { position: absolute; inset: 0; height: 100%; padding: 0; border: none; border-radius: 0; }
    /* Inside a scrolling gallery the video and PDF stack above the images */
    .viewer-body .gallery .video-wrap { position: relative; inset: auto; height: 0; padding-bottom: 56.25%; margin-bottom: 14px; }
    .viewer-body .gallery .pdf-frame { margin-bottom: 14px; }
    .viewer-body .gallery > :last-child { margin-bottom: 0; }

    .pdf-wrapper {
      position: relative;
    }

    .pdf-frame {
      width: 100%;
      height: 70vh;
      border: 1px solid #d8d5d0;
      border-radius: 4px;
      background: var(--pdf-colour);
      display: block;
    }

    .fullscreen-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255,255,255,0.9);
      border: 1px solid #d8d5d0;
      border-radius: 4px;
      padding: 5px 9px;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      color: #000;
      font-family: 'NomKabarFont2', sans-serif;
      transition: background 0.2s;
    }

    .fullscreen-btn:hover { background: #fff; }

    .video-wrap {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #d8d5d0;
    }

    .video-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    footer {
      margin-top: 1.25rem;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--footer-colour);
      text-transform: uppercase;
    }

    /* Tablet / phone: scattered boxes don't fit, so stack them */
    @media (max-width: 900px) {
      /* Phone boxes, icon row and viewer hang off --boxes-top, not the waterline,
         so Waterline height moves only the water: header bottom + 39px = where
         the waterline line sat (-54px) when they were freed from it */
      .container { --boxes-top: calc(var(--header-bottom, 160px) + 39px); }
      .container { padding-top: calc(var(--boxes-top) + 34px); }   /* clear the wave + gap */
      .pboxes {
        position: relative;
        height: auto;
        max-height: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.7vh;
        padding-bottom: 0.3rem;
      }
      .pbox {
        position: relative;   /* keeps flow layout but allows the left offsets */
        height: calc(min(122px, 15vh) * var(--box-scale-phone) * var(--own-scale-phone, 1));   /* smaller so five boxes fit the column */
        aspect-ratio: 185 / 172;   /* keep the desktop box proportions */
        width: auto;
        padding: var(--box-padding-phone);
        border-width: var(--box-line-phone);
        border-radius: var(--box-corner-phone);
      }
      .pbox-icon { width: min(var(--logo-size-phone), 10.5vh); }   /* scales so it never overflows the box */
      .pbox-title { font-size: var(--button-text-phone); }
      .wave-boat { width: var(--boat-size-phone); }
      /* Much smaller skyline on phones, raised higher */
      .skyline {
        --sky-drop: 52px;   /* 20px lift + 32px wave edge */
        --sky-line: var(--skyline-line-phone);
        --sky-step-width: var(--skyline-step-width-phone);
        --sky-step-height: var(--skyline-step-height-phone);
        --sky-nodes: var(--skyline-nodes-phone);
        --sky-mirror: var(--skyline-mirror-phone);
        --sky-pattern: var(--skyline-pattern-phone);
        --sky-l-spacing: var(--skyline-lights-spacing-phone);
        --sky-l-amount: var(--skyline-lights-amount-phone);
        --sky-l-size: var(--skyline-lights-size-phone);
        --sky-l-size-var: var(--skyline-lights-size-variation-phone);
        --sky-l-depth: var(--skyline-lights-depth-phone);
        --sky-l-fade: var(--skyline-lights-fade-phone);
        --sky-l-roof: var(--skyline-lights-roof-phone);
        --sky-l-wall: var(--skyline-lights-wall-phone);
        --sky-l-rows: var(--skyline-lights-rows-phone);
        --sky-l-row-length: var(--skyline-lights-row-length-phone);
        --sky-l-jitter: var(--skyline-lights-jitter-phone);
        --sky-l-flicker: var(--skyline-lights-flicker-phone);
      }
      .skyline .clouds {
        --cloud-tile: var(--cloud-scale-phone);
        --cloud-stroke: var(--cloud-line-phone);
        --cloud-node-list: var(--cloud-nodes-phone);
      }
      .title { --t-outline: var(--title-outline-phone); --t-offset: var(--title-offset-phone); }
      .wave-line .drawn-line { stroke-width: var(--wave-line-phone); }
      .water .drawn-line { stroke-width: var(--grid-line-phone); }
      /* Closed: placed freely by the --box-*-x-phone / -y-phone values (x = box centre,
         y = box top) in an area the height of the old five-box column */
      .container:not(.is-open) .pboxes {
        display: block;
        height: calc(5 * min(122px, 15vh) * var(--box-scale-phone) + 2.8vh + 0.3rem);
      }
      .container:not(.is-open) .pbox { position: absolute; transform: translateX(-50%); }
      .container:not(.is-open) .pbox--illustration  { left: var(--box-illustration-x-phone);  top: var(--box-illustration-y-phone); }
      .container:not(.is-open) .pbox--experimental  { left: var(--box-experimental-x-phone);  top: var(--box-experimental-y-phone); }
      .container:not(.is-open) .pbox--storyboarding { left: var(--box-storyboarding-x-phone); top: var(--box-storyboarding-y-phone); }
      .container:not(.is-open) .pbox--showreel      { left: var(--box-showreel-x-phone);      top: var(--box-showreel-y-phone); }
      .container:not(.is-open) .pbox--drawings      { left: var(--box-drawings-x-phone);      top: var(--box-drawings-y-phone); }

      /* Open: the four icons sit in a fixed single row ABOVE the viewer */
      .container { --page-top: 1.5rem; }   /* the body's top padding */
      .container.is-open .pboxes {
        position: fixed;
        top: calc(var(--boxes-top) + 16px + var(--page-top));
        left: 0;
        right: 0;
        height: auto;
        flex-direction: row;
        flex-wrap: nowrap;
        justify-content: center;
        align-items: flex-start;
        gap: 8px;
        padding: 0;
        z-index: 61;
      }
      .container.is-open .pbox {
        width: 64px;
        height: auto;            /* aspect-ratio keeps the proportion */
      }
      .container.is-open .pbox-icon { width: var(--logo-size-open-phone); }

      .viewer {
        position: fixed;
        left: calc((100vw - var(--viewer-width-phone)) / 2);   /* Viewer width (phone), centred */
        right: calc((100vw - var(--viewer-width-phone)) / 2);
        width: auto;
        max-width: none;
        top: calc(var(--boxes-top) + 96px + var(--page-top));   /* below the icon row, leaving a gap */
        bottom: 3vh;
        height: auto;
        max-height: none;
        z-index: 60;
        border-width: var(--viewer-line-phone);
      }

      /* Copyright line pinned to the bottom of the window, in the 3vh under the viewer */
      footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3vh;
        line-height: 3vh;
        margin: 0;
      }
    }

    @media (max-width: 480px) {
      body { padding: 1rem 1rem 0.75rem; }
      .container { --page-top: 1rem; }   /* the body's top padding */
      /* The smaller header padding (bottom 1.9rem -> 1rem) and body padding
         (1.5rem -> 1rem) lift the boxes ~22px more than the title, so add it
         back: the title-to-buttons gap matches 481-900px */
      .container { padding-top: calc(var(--boxes-top) + 34px + 22px); }
      .fixed-header { padding: 1.2rem 1rem 1rem; }
      .contact-link { top: calc(1.2rem - var(--mail-offset-phone)); right: 1.2rem; }
      .contact-icon { width: var(--mail-size-phone); }
      .phone-contact { top: calc(1.2rem - var(--phone-offset-phone)); left: 1.2rem; }
      .fixed-header > .contact-link { --open-x: var(--mail-open-x-phone);  --open-y: var(--mail-open-y-phone); }
      .phone-contact                { --open-x: var(--phone-open-x-phone); --open-y: var(--phone-open-y-phone); }
      .phone-contact .contact-icon { width: var(--phone-size-phone); }
    }
  </style>

  <script>
    const isMobile = window.innerWidth <= 768;
    const baseUrl = window.location.href.replace(/\/[^/]*$/, '/');

    const SECTIONS = {
      illustration:  { type: 'pdf',   file: 'ArtAndIllustrationFolio.pdf', title: 'Art & Illustration Portfolio' },
      experimental:  { type: 'gallery', video: 'https://www.youtube.com/embed/a1LGS7IE8gc', pdf: 'ExperimentalFolio1.pdf', title: 'Experimental Portfolio' },
      storyboarding: { type: 'pdf',   file: 'StoryboardFolio.pdf',         title: 'Storyboarding Portfolio' },
      showreel:      { type: 'video', file: 'https://www.youtube.com/embed/frCgh0a3msg', title: 'Game Art Show Reel' },
      drawings:      { type: 'gallery', title: 'Drawings' }
    };

    // Each box's images: the file names in --box-<id>-images, from its folder
    function imagesText(id) {
      return getComputedStyle(document.documentElement).getPropertyValue('--box-' + id + '-images').trim().replace(/^["']|["']$/g, '');
    }
    // Show PDF: --box-<id>-pdf (off hides the box's PDF)
    function pdfShown(id) {
      return getComputedStyle(document.documentElement).getPropertyValue('--box-' + id + '-pdf').trim() !== 'off';
    }
    function boxImages(id) {
      return imagesText(id).split(',').map(n => n.trim()).filter(Boolean).map(n => id + '/' + encodeURI(n));
    }

    const stage = document.getElementById('stage');
    const viewerBody = document.querySelector('.viewer-body');
    let openId = '';        // the box whose viewer is open
    let shownImages = '';   // its image list as last drawn

    function getPdfSrc(filename) {
      if (isMobile) {
        return 'https://docs.google.com/viewer?url=' + encodeURIComponent(baseUrl + filename) + '&embedded=true';
      }
      return filename;
    }

    function loadViewer(id) {
      const s = SECTIONS[id];
      if (!s) return;
      const images = boxImages(id);
      shownImages = imagesText(id) + '|' + pdfShown(id);
      if (s.type === 'gallery' || images.length || !pdfShown(id)) {
        // Optional video, then optional PDF, then the images, all in one scroll
        // (a PDF or video box with images becomes a scroll like this too)
        const video = s.video || (s.type === 'video' ? s.file : '');
        const pdf = pdfShown(id) ? (s.pdf || (s.type === 'pdf' ? s.file : '')) : '';
        viewerBody.innerHTML =
          '<div class="gallery">' +
          (video ? '<div class="video-wrap"><iframe src="' + video + '" title="' + s.title + '" allowfullscreen></iframe></div>' : '') +
          (pdf ? '<iframe class="pdf-frame" src="' + getPdfSrc(pdf) + '" title="' + s.title + '"></iframe>' : '') +
          images.map(function (src) { return '<img src="' + src + '" alt="" draggable="false">'; }).join('') +
          '</div>';
      } else if (s.type === 'pdf') {
        viewerBody.innerHTML =
          '<iframe class="pdf-frame" src="' + getPdfSrc(s.file) + '" title="' + s.title + '"></iframe>';
      } else {
        viewerBody.innerHTML =
          '<div class="video-wrap"><iframe src="' + s.file + '" title="' + s.title + '" allowfullscreen></iframe></div>';
      }
    }

    // No right-click menu (Save image / Open image in new tab) over the gallery
    viewerBody.addEventListener('contextmenu', function (e) {
      if (e.target.closest('.gallery')) e.preventDefault();
    });
    viewerBody.addEventListener('dragstart', function (e) {
      if (e.target.closest('.gallery')) e.preventDefault();
    });

    function openSection(id) {
      if (!SECTIONS[id]) return;
      openId = id;
      loadViewer(id);
      stage.classList.add('is-open');
      document.body.classList.add('panel-open');
      document.querySelectorAll('.pbox').forEach(b =>
        b.classList.toggle('is-active', b.dataset.id === id));
    }

    function closeViewer() {
      openId = '';
      stage.classList.remove('is-open');
      document.body.classList.remove('panel-open');
      document.querySelectorAll('.pbox').forEach(b => b.classList.remove('is-active'));
      // clear content (stops the video) once the close animation has played
      setTimeout(() => { if (!stage.classList.contains('is-open')) viewerBody.innerHTML = ''; }, 450);
    }

    // A box opens (or, while open, switches to) its section
    document.querySelectorAll('.pbox').forEach(box => {
      box.addEventListener('click', () => openSection(box.dataset.id));
    });

    // Clicking the title leaves the viewer
    document.querySelector('.title').addEventListener('click', () => {
      if (stage.classList.contains('is-open')) closeViewer();
    });

    // Click anywhere outside the viewer/boxes (and not on a link) closes it.
    document.addEventListener('click', function (e) {
      if (!stage.classList.contains('is-open')) return;
      if (e.target.closest('.viewer') ||
          e.target.closest('.pbox') ||
          e.target.closest('a')) {
        return;
      }
      closeViewer();
    });

    // Keep the wavy waterline pinned to the actual header height (raised by
    // --wave-raise), so the water edge meets the wave line at every window width.
    // The skyline and clouds measure from the same place with their own
    // raises (--sky-raise, --cloud-raise), so each moves on its own.
    let skyCentre = null;   // the title text's centre in px, for setSkyline()
    function setWaterline() {
      const h = document.querySelector('.fixed-header').getBoundingClientRect().bottom;
      document.documentElement.style.setProperty('--header-bottom', h + 'px');   // the waterline layer's height
      const root = getComputedStyle(document.documentElement);
      const line = name => Math.round(h - 15 - (parseFloat(root.getPropertyValue(name)) || 0)) + 'px';
      document.documentElement.style.setProperty('--waterline', line('--wave-raise'));
      document.documentElement.style.setProperty('--sky-ground', line('--sky-raise'));
      document.documentElement.style.setProperty('--cloud-ground', line('--cloud-raise'));
      // The skyline mirrors about the title TEXT centre (the h1 is full-width,
      // so measure the text with a Range instead of the element box)
      const range = document.createRange();
      range.selectNodeContents(document.querySelector('.title'));
      const rects = [...range.getClientRects()];
      if (rects.length) {
        skyCentre = (Math.min(...rects.map(r => r.left)) + Math.max(...rects.map(r => r.right))) / 2;
        setSkyline();
      }
      if (cloudKey !== undefined) setClouds();   // their ground moves too
    }
    setWaterline();
    window.addEventListener('resize', setWaterline);
    // ResizeObserver catches the header reflow when the web font finishes loading,
    // at any window width — keeping the waterline glued to the wave line.
    if (window.ResizeObserver) {
      new ResizeObserver(setWaterline).observe(document.querySelector('.fixed-header'));
    }

    // Wave repeat: pattern width isn't CSS, so scale the drawn 320px wave to
    // --wave-tile, up and down too (about its middle, y 29 of the 64px band) so
    // it keeps its shape; coordinates only, so the line keeps its thickness.
    // --wave-scale lets the water edge mask scale the same way.
    const waveTile = document.getElementById('waveTile');
    const waveD = waveTile.querySelector('path').getAttribute('d');
    let waveWidth = 0;
    function setWaveRepeat() {
      const w = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--wave-tile')) || 320;
      if (w === waveWidth) return;
      waveWidth = w;
      const k = w / 320;
      let i = 0;
      document.documentElement.style.setProperty('--wave-scale', k);
      waveTile.setAttribute('width', w);
      waveTile.querySelector('path').setAttribute('d',
        waveD.replace(/-?[\d.]+/g, n => String(+(i++ % 2 ? 29 + (parseFloat(n) - 29) * k : parseFloat(n) * k).toFixed(2))));
    }
    setWaveRepeat();
    window.addEventListener('resize', setWaveRepeat);   // web <-> phone value

    // Grid repeat: scale the drawn 148px grid tile to --grid-tile (Grid repeat,
    // web / phone value), coordinates only, so the lines keep their thickness
    const gridTile = document.getElementById('gridTile');
    const gridD = gridTile.querySelector('path').getAttribute('d');
    let gridSize = 0;
    function setGridRepeat() {
      const g = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--grid-tile')) || 148;
      if (g === gridSize) return;
      gridSize = g;
      gridTile.setAttribute('width', g);
      gridTile.setAttribute('height', g);
      gridTile.querySelector('path').setAttribute('d',
        gridD.replace(/-?[\d.]+/g, n => String(+(parseFloat(n) * g / 148).toFixed(2))));
    }
    setGridRepeat();
    window.addEventListener('resize', setGridRepeat);   // web <-> phone value

    // Skyline: steps laid out from the mirror point (title centre +
    // --sky-mirror) outwards, the same either side. Their heights go
    // -1, 0, +1... = mid height - / + the step height, in the order
    // --sky-pattern picks (see below). --sky-nodes = "across% mid-height step-width+/- step-height+/-, ..."
    // (across = 0% at the mirror point to 100% at the far window edge; mid
    // height px above the ground; the +/- px adjust --sky-step-width and
    // --sky-step-height), all tweened node to node and always mirrored. Each
    // step's width is taken where it starts, its heights at its middle. In
    // the mirrored patterns the two innermost steps meet as one.
    function setSkyline() {
      if (skyCentre === null) return;
      const layer = document.querySelector('.skyline');
      const css = getComputedStyle(layer);
      const width = parseFloat(css.getPropertyValue('--sky-step-width')) || 0;
      const height = parseFloat(css.getPropertyValue('--sky-step-height')) || 0;
      const drop = parseFloat(css.getPropertyValue('--sky-drop')) || 0;
      const nodes = css.getPropertyValue('--sky-nodes').split(',')
        .map(n => n.match(/-?[\d.]+/g)).filter(n => n && n.length >= 2)
        .map(n => [0, 1, 2, 3].map(j => parseFloat(n[j]) || 0)).sort((a, b) => a[0] - b[0]);
      const box = layer.getBoundingClientRect();
      // y of the ground line: the skyline's own waterline (--sky-ground) + the
      // layer's 32px past it - the drop, as it was off the real waterline
      const ground = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sky-ground')) || 0) + 32 - drop;
      const centre = skyCentre + (parseFloat(css.getPropertyValue('--sky-mirror')) || 0);
      const half = Math.max(centre, box.width - centre);   // 100% across
      const along = (u, j) => {                            // node value j, u px out from the mirror point
        if (!nodes.length) return 0;
        const p = u / half * 100;
        if (p <= nodes[0][0]) return nodes[0][j];
        for (let i = 1; i < nodes.length; i++) {
          const a = nodes[i - 1], b = nodes[i];
          if (p <= b[0]) return b[0] === a[0] ? b[j] : a[j] + (b[j] - a[j]) * (p - a[0]) / (b[0] - a[0]);
        }
        return nodes[nodes.length - 1][j];
      };
      // Step pattern: the levels counting outwards from the mirror point on
      // the left and right. mirrored: +1, 0, -1 both sides (reading in: low,
      // mid, high); mirrored-opposite: -1, 0, +1 both sides (reading in: high,
      // mid, low); left / right: one pattern across the whole width, climbing
      // that way.
      const OUT_DOWN = [1, 0, -1], OUT_UP = [-1, 0, 1];
      const [levelL, levelR] = {
        'mirrored-opposite': [OUT_UP, OUT_UP],
        left: [OUT_UP, OUT_DOWN],
        right: [OUT_DOWN, OUT_UP],
      }[css.getPropertyValue('--sky-pattern').trim()] || [OUT_DOWN, OUT_DOWN];
      const steps = [];
      for (let u = 0, k = 0; u <= half && k < 5000; k++) {
        const w = Math.max(1, width + along(u, 2));
        const mid = u + w / 2;
        steps.push({ u0: u, u1: u + w, base: ground - along(mid, 1), rise: height + along(mid, 3) });
        u += w;
      }
      const X = u => (centre + u).toFixed(2);
      const Y = (level, k) => (steps[k].base - level[k % 3] * steps[k].rise).toFixed(2);
      const last = steps.length - 1;
      // Left edge in to the mirror point, then out to the right edge
      let d = 'M' + X(-steps[last].u1) + ' ' + Y(levelL, last);
      for (let k = last; k >= 0; k--) d += ' V' + Y(levelL, k) + ' H' + X(-steps[k].u0);
      steps.forEach((st, k) => { d += ' V' + Y(levelR, k) + ' H' + X(st.u1); });
      // The fill runs right down the fill layer (past the wave edge)
      const floor = Math.max(box.height + 1, ...steps.map(st => st.base + Math.abs(st.rise) + 1));
      document.getElementById('skylineLine').setAttribute('d', d);
      document.getElementById('skylineFill').setAttribute('d', d + ' V' + floor.toFixed(2) + ' H' + X(-steps[last].u1) + ' Z');
      // Each step is one building face for the lights: its left x, right x
      // and roof y. Innermost steps that meet as one roof are one face.
      const faces = [];
      steps.forEach((st, k) => {
        faces.push({ side: 0, k, x0: centre - st.u1, x1: centre - st.u0, roof: +Y(levelL, k) });
        faces.push({ side: 1, k, x0: centre + st.u0, x1: centre + st.u1, roof: +Y(levelR, k) });
      });
      if (steps.length && Y(levelL, 0) === Y(levelR, 0)) {
        faces[0].x1 = faces[1].x1;
        faces.splice(1, 1);
      }
      setSkyLights(css, faces, box.width);
    }

    // Skyline lights (seen only at night): dots in a grid of --sky-l-spacing
    // cells inside each building face, from --sky-l-roof under its roof down
    // to --sky-l-depth below the skyline's average roof, kept --sky-l-wall
    // off its sides. Cells are lit at
    // random (seeded per face, so one face changing leaves the rest) until
    // --sky-l-amount of them are, fewer further down (--sky-l-fade); a
    // --sky-l-rows share of them light as side-by-side rows of up to
    // --sky-l-row-length dots, like the window generator's runs.
    function setSkyLights(css, faces, screenWidth) {
      const num = (name, fallback) => { const n = parseFloat(css.getPropertyValue(name)); return isNaN(n) ? fallback : n; };
      const rootCss = getComputedStyle(document.documentElement);
      const seed = Math.round(parseFloat(rootCss.getPropertyValue('--skyline-lights-seed')) || 0);
      const spacing = Math.max(2, num('--sky-l-spacing', 8));
      const amount = Math.min(1, Math.max(0, num('--sky-l-amount', 0)));
      const size = Math.max(0, num('--sky-l-size', 2));
      const sizeVar = Math.min(1, Math.max(0, num('--sky-l-size-var', 0)));
      const depth = num('--sky-l-depth', 0);
      const fade = Math.min(1, Math.max(0, num('--sky-l-fade', 0)));
      const roofGap = num('--sky-l-roof', 0) + num('--sky-line', 0) / 2;   // from the line's underside
      const wall = num('--sky-l-wall', 0);
      const rowShare = Math.min(1, Math.max(0, num('--sky-l-rows', 0)));
      const rowLength = Math.max(2, Math.round(num('--sky-l-row-length', 2)));
      const jitter = Math.max(0, num('--sky-l-jitter', 0));
      const flicker = Math.min(1, Math.max(0, num('--sky-l-flicker', 0)));
      // Small seeded random numbers (mulberry32)
      const random = s => () => {
        s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      // Depth runs down from the whole skyline's average roof height (each
      // face weighted by how much of it is on screen), so every face's lights
      // stop at the same line: low buildings get fewer rows, tall ones more.
      let roofSum = 0, widthSum = 0;
      for (const f of faces) {
        const w = Math.min(f.x1, screenWidth) - Math.max(f.x0, 0);
        if (w > 0) { roofSum += f.roof * w; widthSum += w; }
      }
      const bottom = (widthSum ? roofSum / widthSum : 0) + depth;
      let out = '';
      for (const f of faces) {
        if (f.x1 < 0 || f.x0 > screenWidth || amount <= 0) continue;
        const cols = Math.floor((f.x1 - f.x0 - 2 * wall) / spacing);
        const rows = Math.floor((bottom - f.roof - roofGap) / spacing);
        if (cols < 1 || rows < 1) continue;
        const rnd = random(seed * 100003 + f.side * 50021 + f.k * 7919 + 1);
        const left = f.x0 + wall + (f.x1 - f.x0 - 2 * wall - cols * spacing) / 2 + spacing / 2;
        const top = f.roof + roofGap + spacing / 2;
        const lit = new Uint8Array(cols * rows);
        const target = Math.round(amount * cols * rows);
        let count = 0;
        for (let tries = 0; count < target && tries < cols * rows * 20; tries++) {
          const c = Math.floor(rnd() * cols), r = Math.floor(rnd() * rows);
          if (lit[r * cols + c]) continue;
          if (rows > 1 && rnd() < fade * r / (rows - 1)) continue;   // thinner further down
          // A row: 2..row length dots, short ones more often
          const run = rnd() < rowShare ? 2 + Math.floor(rnd() * rnd() * (rowLength - 1)) : 1;
          for (let i = 0; i < run && c + i < cols && !lit[r * cols + c + i] && count < target; i++) {
            lit[r * cols + c + i] = 1;
            count++;
          }
        }
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          if (!lit[r * cols + c]) continue;
          const x = left + c * spacing + (rnd() * 2 - 1) * jitter;
          const y = top + r * spacing + (rnd() * 2 - 1) * jitter;
          const rad = size / 2 * (1 + (rnd() * 2 - 1) * sizeVar);
          const tw = rnd() < flicker
            ? ` class="twinkle" style="animation-duration:${(2 + rnd() * 4).toFixed(2)}s;animation-delay:${(-rnd() * 6).toFixed(2)}s"` : '';
          out += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${Math.max(0, rad).toFixed(2)}"${tw}/>`;
        }
      }
      const g = document.getElementById('skyLights');
      if (g.innerHTML !== out) g.innerHTML = out;
    }
    setSkyline();
    window.addEventListener('resize', setSkyline);

    // Clouds: the drawn 461 x 297 cloud tile (kept in the svg's <defs>) laid
    // end to end across the layer and bent along --cloud-node-list =
    // "across% height scale+/-, ..." (across = 0% left edge to 100% right
    // edge; height px adds to Cloud height; scale +/- adds to --cloud-tile),
    // tweened node to node. Where the scale is bigger the drawing is wider
    // AND taller there, so one cloud runs smoothly into the next with no
    // joins. Coordinates only, so the line keeps its thickness. Called from
    // setWaterline (the ground moves), on resize and by the head observer.
    var cloudKey;   // var: setWaterline runs before this line is reached
    function setClouds() {
      const svg = document.querySelector('.clouds');
      const layer = svg && svg.closest('.skyline');
      if (!layer || !document.getElementById('cloudFillDrawn')) return;
      const css = getComputedStyle(svg);
      const S = parseFloat(css.getPropertyValue('--cloud-tile')) || 1;
      const nodes = css.getPropertyValue('--cloud-node-list').split(',')
        .map(n => n.match(/-?[\d.]+/g)).filter(n => n && n.length >= 2)
        .map(n => [0, 1, 2].map(j => parseFloat(n[j]) || 0)).sort((a, b) => a[0] - b[0]);
      const box = layer.getBoundingClientRect();
      const W = box.width;
      const drop = parseFloat(getComputedStyle(layer).getPropertyValue('--sky-drop')) || 0;
      const base = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cloud-ground')) || 0) + 32 - drop;
      const floor = box.height + 1;
      const key = [W, base, floor, S, JSON.stringify(nodes)].join('|');
      if (key === cloudKey) return;
      cloudKey = key;
      const along = (x, j) => {                     // node value j at x px from the left edge
        if (!nodes.length) return 0;
        const p = x / (W || 1) * 100;
        if (p <= nodes[0][0]) return nodes[0][j];
        for (let i = 1; i < nodes.length; i++) {
          const a = nodes[i - 1], b = nodes[i];
          if (p <= b[0]) return b[0] === a[0] ? b[j] : a[j] + (b[j] - a[j]) * (p - a[0]) / (b[0] - a[0]);
        }
        return nodes[nodes.length - 1][j];
      };
      const scale = x => Math.max(0.03, S + along(x, 2));
      // Table of drawing x (u) every 2px across, u = 0 at the left edge;
      // past the window the edge values carry on
      const STEP = 2, PAD = 1500;
      const xs = [], us = [];
      for (let x = -PAD, u = 0; x <= W + PAD; x += STEP) {
        xs.push(x);
        us.push(u);
        u += STEP / scale(x + STEP / 2);
      }
      const zero = us[PAD / STEP];
      for (let i = 0; i < us.length; i++) us[i] -= zero;
      const toX = u => {                             // screen x for drawing x u
        let lo = 0, hi = us.length - 1;
        if (u <= us[lo]) return xs[lo] + (u - us[lo]) * scale(xs[lo]);
        if (u >= us[hi]) return xs[hi] + (u - us[hi]) * scale(xs[hi]);
        while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (us[mid] <= u) lo = mid; else hi = mid; }
        return xs[lo] + (xs[hi] - xs[lo]) * (u - us[lo]) / (us[hi] - us[lo]);
      };
      const pt = (u, v) => {                         // drawing point -> screen [x, y]
        const x = toX(u);
        return [x, base - along(x, 1) - (297 - v) * scale(x)];
      };
      const f2 = n => n.toFixed(2);
      const tokens = id => document.getElementById(id).getAttribute('d').match(/[A-Za-z]|-?[\d.]+/g);
      const fillSrc = tokens('cloudFillDrawn'), lineSrc = tokens('cloudLineDrawn');
      const uEnd = us[us.length - 1 - PAD / STEP];   // drawing x at the right edge
      let fill = '', line = '';
      for (let k = -2; k * 461 <= uEnd + 485; k++) {
        const off = k * 461;
        // Fill: the contour's points, closed off down the layer
        let first = null, last = null;
        for (let i = 0; i < fillSrc.length; i++) {
          const t = fillSrc[i];
          if (/[A-Za-z]/.test(t)) { if (t === 'V') break; continue; }
          const p = pt(off + parseFloat(t), parseFloat(fillSrc[++i]));
          fill += (first ? ' L' : ' M') + f2(p[0]) + ' ' + f2(p[1]);
          if (!first) first = p;
          last = p;
        }
        if (first) fill += ' L' + f2(last[0]) + ' ' + f2(floor) + ' L' + f2(first[0]) + ' ' + f2(floor) + ' Z';
        // Line: every point (M / C) through the same bend
        for (let i = 0; i < lineSrc.length; i++) {
          const t = lineSrc[i];
          if (/[A-Za-z]/.test(t)) { line += ' ' + t; continue; }
          const p = pt(off + parseFloat(t), parseFloat(lineSrc[++i]));
          line += ' ' + f2(p[0]) + ' ' + f2(p[1]);
        }
      }
      document.getElementById('cloudFill').setAttribute('d', fill);
      document.getElementById('cloudLine').setAttribute('d', line);
    }
    setClouds();
    window.addEventListener('resize', setClouds);   // web <-> phone value

    // Logo shading colour fill: a span masked by each shading PNG. While
    // --logo-shading-colour is transparent the grey PNG shading shows as before.
    for (const img of document.querySelectorAll('.pbox-icon img:nth-of-type(2), .contact-icon img:nth-of-type(2)')) {
      const fill = document.createElement('span');
      fill.className = 'pbox-shading-fill';
      fill.style.setProperty('--shading-png', 'url("' + img.src + '")');
      img.after(fill);
    }
    // Logo white fill: the same for each white bg PNG with --logo-white-colour
    for (const img of document.querySelectorAll('.pbox-icon img:nth-of-type(1), .contact-icon img:nth-of-type(1)')) {
      const fill = document.createElement('span');
      fill.className = 'pbox-white-fill';
      fill.style.setProperty('--white-png', 'url("' + img.src + '")');
      img.after(fill);
    }
    function setFillClass(selector, className) {
      const fill = document.querySelector(selector);
      const colour = fill ? getComputedStyle(fill).backgroundColor : '';
      const off = !colour || colour === 'transparent' || /^rgba\(.*,\s*0\)$/.test(colour);
      document.documentElement.classList.toggle(className, !off);
    }
    // Soul fish / boat fill: each img masked by its own PNG (see .fish-coloured)
    for (const img of document.querySelectorAll('.soul-fish img, .wave-boat img')) {
      img.style.setProperty('--fill-png', 'url("' + img.src + '")');
    }
    function setShadingFill() {
      setFillClass('.pbox-shading-fill', 'shading-coloured');
      setFillClass('.pbox-white-fill', 'white-coloured');
      for (const name of ['fish', 'boat']) {
        const colour = getComputedStyle(document.documentElement).getPropertyValue('--' + name + '-colour').trim();
        document.documentElement.classList.toggle(name + '-coloured', !!colour && colour !== 'transparent');
      }
    }
    setShadingFill();

    // Day / night sky: the viewer's local time picks the page background.
    // Day = 7:00-18:59, night otherwise; re-checked every minute. At night
    // every colour takes its night value (:root.is-night) and the skyline
    // lights show. (data-tuner-night = the Website Tuner's Day / Night preview.)
    function setDayNight() {
      const h = new Date().getHours();
      const forced = document.documentElement.dataset.tunerNight;
      document.documentElement.classList.toggle('is-night', forced ? forced === 'on' : (h < 7 || h >= 19));
      setShadingFill();   // fill colours can differ at night
    }
    setDayNight();
    setInterval(setDayNight, 60000);

    // Phone: the number lives in --phone-number. On a phone (touch, no hover)
    // the tel: link dials as normal; on a computer the click opens a card with
    // the number, Call (whatever calling app the computer has) and Copy.
    const phoneLink = document.getElementById('phoneLink');
    const phoneCard = document.getElementById('phoneCard');
    function setPhone() {
      const number = getComputedStyle(document.documentElement).getPropertyValue('--phone-number').trim().replace(/^["']|["']$/g, '');
      const tel = 'tel:' + number.replace(/[^\d+]/g, '');
      phoneLink.href = tel;
      document.getElementById('phoneCall').href = tel;
      document.getElementById('phoneNumber').textContent = number;
    }
    setPhone();
    phoneLink.addEventListener('click', e => {
      if (matchMedia('(hover: none) and (pointer: coarse)').matches) return;
      e.preventDefault();
      phoneCard.hidden = !phoneCard.hidden;
    });
    document.getElementById('phoneCopy').addEventListener('click', async e => {
      const button = e.currentTarget;
      try {
        await navigator.clipboard.writeText(document.getElementById('phoneNumber').textContent);
        button.textContent = 'Copied';
      } catch (err) {
        getSelection().selectAllChildren(document.getElementById('phoneNumber'));
        button.textContent = 'Press Ctrl+C';
      }
      setTimeout(() => { button.textContent = 'Copy'; }, 1500);
    });
    document.addEventListener('click', e => {
      if (!phoneCard.hidden && !e.target.closest('.phone-contact')) phoneCard.hidden = true;
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') phoneCard.hidden = true; });

    // The open viewer redraws when the Website Tuner changes its box's images
    function setImages() {
      if (openId && imagesText(openId) + '|' + pdfShown(openId) !== shownImages) loadViewer(openId);
    }

    // The Website Tuner swaps the <style> text when a value changes
    // Fish swimming areas: each fish's swim path (drawn for the default area
    // size) is stretched to its area: across = area width - fish width,
    // down = area height. Under 1320px the paths are the shorter phone ones.
    const FISH_PATHS = {
      web: { w: 195, h: 110, lanes: {
        left:   [[0,50],[50,10],[90,90],[140,50],[165,30],[180,65],[195,50]],
        right:  [[195,45],[145,5],[105,85],[55,45],[30,25],[15,60],[0,45]],
        right2: [[185,40],[140,75],[95,10],[55,45],[30,65],[15,25],[0,40]] } },
      phone: { w: 135, h: 90, lanes: {
        left:   [[0,45],[30,12],[60,78],[90,45],[108,28],[122,58],[135,45]],
        right:  [[135,40],[105,7],[75,73],[45,40],[27,22],[13,52],[0,40]],
        right2: [[135,40],[100,70],[65,10],[35,45],[22,58],[10,25],[0,40]] } },
    };
    function setFishAreas() {
      const set = window.innerWidth <= 1320 ? FISH_PATHS.phone : FISH_PATHS.web;
      for (const name in set.lanes) {
        const lane = document.querySelector('.fish-lane--' + name);
        const fish = lane && lane.querySelector('.soul-fish');
        if (!fish) continue;
        const sx = Math.max(0, lane.offsetWidth - fish.offsetWidth) / set.w, sy = lane.offsetHeight / set.h;
        const p = set.lanes[name].map(([x, y]) => (x * sx).toFixed(1) + ',' + (y * sy).toFixed(1));
        fish.style.offsetPath = `path("M ${p[0]} C ${p[1]} ${p[2]} ${p[3]} C ${p[4]} ${p[5]} ${p[6]}")`;
      }
    }
    setFishAreas();
    window.addEventListener('resize', setFishAreas);
    window.addEventListener('load', setFishAreas);   // once the fish images have their size
    new MutationObserver(() => { setFishAreas(); setWaveRepeat(); setGridRepeat(); setWaterline(); setSkyline(); setClouds(); setShadingFill(); setPhone(); setImages(); }).observe(document.head, { childList: true, characterData: true, subtree: true });
  </script>
</body>
</html>
