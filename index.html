  <meta charset="UTF-8">

  <title>Tom Harding Illustration</title>

  <link rel="preload" href="fonts/NomKabarFont2.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* Hand-drawn site font, traced from "website bits - font_template_v2 - Letters.png" (DRAWINGTOOL TEST/FontDrawing1/build_font.py) */
    @font-face {
      font-family: 'NomKabarFont2';
      src: url('fonts/NomKabarFont2.woff2') format('woff2');
      font-weight: 100 900;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { overflow: hidden; }   /* no scrolling anywhere; everything fits the viewport */
    :root { --waterline: 150px; --sky-cut-l: 35%; --sky-cut-r: 65%; }   /* set from header/title in JS */
    :root { --wave-tile: var(--wave-repeat); --wave-raise: var(--wave-height); }
    @media (max-width: 900px) { :root { --wave-tile: var(--wave-repeat-phone); --wave-raise: var(--wave-height-phone); } }

    /* ---- Website Tuner values: the tuner reads and writes this block ---- */
    :root {
      /* Desktop */
      --box-scale: 1.2;                /* portfolio box size (closed boxes) */
      --box-line: 6px;             /* portfolio box border */
      --viewer-line: 6px;          /* viewer panel border */
      --box-corner: 15px;             /* portfolio box corner rounding */
      --box-padding: 0.6rem;         /* space inside portfolio boxes */
      --title-size-large: 2.48rem;   /* title, largest (wide windows) */
      --title-outline: 0px;          /* title text outline */
      --title-skyline-gap: -71px;     /* skyline cut-out either side of the title */
      --button-text: 1.97rem;       /* box titles */
      --logo-size: 163px;            /* box logos */
      --logo-size-open: 120px;       /* box logos while the viewer is open */
      --mail-size: 132px;            /* mail hand */
      --phone-size: 113px;           /* phone (opposite the mail hand; 103 = its height) */
      --boat-size: 60px;             /* wave boat */
      --fish-size: 32px;             /* soul fish */
      --wave-line: 4.2px;            /* wavy line along the waves */
      --wave-repeat: 341px;          /* width of one wave before it repeats (320 = as drawn) */
      --wave-height: -21px;            /* waterline up (+) or down (-): wave line, water edge, skyline */
      --grid-line: 6.1px;            /* water grid backdrop */
      --skyline-line: 4.5px;         /* city skyline */
      --skyline-scale: 1.54;            /* skyline size (1 = 43px high) */
      --skyline-step-width: 19px;     /* width of each step down towards the title */
      --skyline-drop-shrink: 0.74;    /* each drop down = this x the last one */
      --skyline-steps: 6;             /* steps down towards the title */
      --skyline-mid-height: 33px;     /* steps start here, above the skyline ground */
      --skyline-title-height: -56px;    /* last step by the title, above the skyline ground (minus = below) */
      /* Closed box positions: x = box centre across, y = box top down (% of the box area); scale = x Box scale */
      --box-illustration-x: 49.3%;
      --box-illustration-y: 3.8%;
      --box-illustration-scale: 1.18;
      --box-experimental-x: 24.8%;
      --box-experimental-y: 14.3%;
      --box-experimental-scale: 1.04;
      --box-storyboarding-x: 74.4%;
      --box-storyboarding-y: 20%;
      --box-storyboarding-scale: 1.16;
      --box-showreel-x: 37%;
      --box-showreel-y: 51.5%;
      --box-showreel-scale: 1.1;
      --box-drawings-x: 60.4%;
      --box-drawings-y: 64.2%;
      --box-drawings-scale: 1;
      /* Phone */
      --box-scale-phone: 1;          /* under 900px, closed boxes */
      --box-line-phone: 4.2px;       /* under 900px */
      --viewer-line-phone: 1.8px;    /* under 900px */
      --box-corner-phone: 10px;       /* under 900px */
      --box-padding-phone: 0.35rem;  /* under 900px */
      --title-size-small: 2rem;  /* title, smallest (narrow windows) */
      --title-outline-phone: 0px;    /* under 900px */
      --title-skyline-gap-phone: -42px; /* under 900px */
      --button-text-phone: 1.25rem;   /* under 900px */
      --logo-size-phone: 117px;       /* under 900px, never above 10.5vh */
      --logo-size-open-phone: 51px;  /* under 900px */
      --mail-size-phone: 53px;       /* under 480px */
      --phone-size-phone: 42px;       /* under 480px */
      --boat-size-phone: 60px;       /* under 900px */
      --fish-size-phone: 26px;       /* under 1320px */
      --wave-line-phone: 3px;      /* under 900px */
      --wave-repeat-phone: 109px;    /* under 900px */
      --wave-height-phone: -14px;      /* under 900px */
      --grid-line-phone: 2.8px;      /* under 900px */
      --skyline-line-phone: 1.9px;   /* under 900px */
      --skyline-scale-phone: 0.46; /* under 900px */
      --skyline-step-width-phone: 14px; /* under 900px */
      --skyline-drop-shrink-phone: 0.72; /* under 900px */
      --skyline-steps-phone: 4;       /* under 900px */
      --skyline-mid-height-phone: 6px; /* under 900px */
      --skyline-title-height-phone: -31px; /* under 900px */
      --box-illustration-x-phone: 48.2%;   /* under 900px, closed box positions as above */
      --box-illustration-y-phone: -0.5%;
      --box-illustration-scale-phone: 1.19;
      --box-experimental-x-phone: 70.8%;
      --box-experimental-y-phone: 23.7%;
      --box-experimental-scale-phone: 1.18;
      --box-storyboarding-x-phone: 25.4%;
      --box-storyboarding-y-phone: 31.2%;
      --box-storyboarding-scale-phone: 1;
      --box-showreel-x-phone: 60.6%;
      --box-showreel-y-phone: 53.6%;
      --box-showreel-scale-phone: 1;
      --box-drawings-x-phone: 33.4%;
      --box-drawings-y-phone: 73.9%;
      --box-drawings-scale-phone: 1;
      /* Colours (web and mobile) */
      --page-colour: #e5f9ff;        /* page background */
      --water-colour: #5e7ba1;       /* water under the waves */
      --grid-line-colour: #365587;   /* water grid */
      --wave-line-colour: #a2bbec;   /* wavy line along the waves */
      --skyline-colour: #a2bbec;     /* city skyline */
      --skyline-fill-colour: #365587; /* under the skyline, down to the water */
      --logo-shading-colour: #a2bbec; /* box logo shading fill (transparent = grey PNG shading) */
      --logo-white-colour: #e5f9ff; /* logo + mail hand white bg fill (transparent = white PNG) */
      --contact-hover-colour: #a2bbec; /* phone + mail white fill under the mouse */
      --fish-colour: #e5f9ff;    /* soul fish as one solid fill (transparent = the drawing) */
      --boat-colour: #e5f9ff;    /* boat as one solid fill (transparent = the drawing) */
      --title-colour: #000000;       /* title */
      --title-outline-colour: #ffffff; /* title text outline */
      --box-colour: #e5f9ff;         /* portfolio box fill */
      --box-hover-colour: #a2bbec;   /* box fill under the mouse */
      --box-active-colour: #a2bbec;  /* box fill while its viewer is open */
      --box-line-colour: #a2bbec;    /* portfolio box border */
      --box-text-colour: #000000;    /* box titles */
      --viewer-colour: #f7f5f2;      /* viewer panel fill */
      --viewer-line-colour: #a2bbec; /* viewer panel border */
      --viewer-close-colour: #000000; /* viewer X */
      --gallery-colour: #f7f5f2;     /* Drawings / Experimental scroll area */
      --pdf-colour: #ffffff;         /* behind the PDFs */
      --footer-colour: #aaaaaa;      /* copyright line */
      /* Contact */
      --phone-number: "+447944984176";            /* the phone icon calls this */
    }

    /* Wave line, grid and skyline: hand-drawn lines traced to SVG paths, so the
       line thickness is a setting (the --*-line values above) */
    .drawn-line {
      fill: none;
      stroke: #000;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: transparent;   /* let the wavy water edge define the boundary */
      text-align: center;
      padding: 3.5rem 1.5rem 1.9rem;
      --tile: var(--wave-tile);
    }

    /* Wavy line along the header's bottom edge, raised by --wave-raise. The
       --tile x 32 tile (setWaveRepeat() stretches the drawn 320) sits in the
       middle of a 64px band so thick lines aren't clipped; the strip is one
       tile wider than the screen and slides one tile left, then repeats. */
    .wave-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64px;
      transform: translateY(calc(50% - var(--wave-raise)));
      overflow: hidden;
      pointer-events: none;
    }
    .wave-line svg {
      display: block;
      width: calc(100% + var(--tile));
      height: 100%;
      animation: waveFlow 8.6s linear infinite;
    }
    .wave-line .drawn-line { stroke-width: var(--wave-line); stroke: var(--wave-line-colour); }

    @keyframes waveFlow {
      from { transform: translateX(0); }
      to   { transform: translateX(calc(-1 * var(--tile))); }
    }

    /* Easter-egg boat: sails right-to-left across the wave every so often */
    .wave-boat {
      position: absolute;
      bottom: calc(-24px + var(--wave-raise));
      left: 100%;
      width: var(--boat-size);
      pointer-events: none;
      z-index: 1;
      animation: boatSail 120s linear infinite;
      animation-delay: 6s;
    }

    /* Only the boat itself is clickable; the wrapper stays click-through */
    .wave-boat a {
      display: block;
      width: 100%;
      pointer-events: auto;
      cursor: pointer;
    }

    .wave-boat img {
      display: block;
      width: 100%;
      height: auto;
      transform-origin: 50% 85%;
      animation: boatRock 4s ease-in-out infinite;
    }

    /* Travel: crosses the screen in 40s, then rests off-screen for the rest of the cycle */
    @keyframes boatSail {
      0%    { transform: translateX(0); }
      33.3% { transform: translateX(calc(-100vw - 96px)); }
      100%  { transform: translateX(calc(-100vw - 96px)); }
    }

    /* Rock: tilts ~17.5deg up one side, then up the other */
    @keyframes boatRock {
      0%, 100% { transform: rotate(-17.5deg); }
      50%      { transform: rotate(17.5deg); }
    }

    /* Soul fish: swim winding routes in the margins either side of the column.
       Each lane is the containing block, so the motion path resolves inside it. */
    .fish-lane {
      position: absolute;
      width: 230px;
      height: 110px;
      z-index: 1;
      pointer-events: none;
      transition: transform 2.2s ease, opacity 2.2s ease;
    }

    /* When the viewer is open the fish disperse off-screen, and return on close */
    body.panel-open .fish-lane--left  { transform: translateX(-75vw); opacity: 0; }
    body.panel-open .fish-lane--right,
    body.panel-open .fish-lane--right2 { transform: translateX(75vw); opacity: 0; }

    .fish-lane--left   { left: calc(50% - 410px - 250px); top: 42vh; }
    .fish-lane--right  { left: calc(50% + 410px + 20px);  top: 34vh; }
    .fish-lane--right2 { left: calc(50% + 410px + 40px);  top: 58vh; }

    .soul-fish {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--fish-size);
      offset-rotate: 0deg;          /* stay upright; don't tumble along the curve */
      pointer-events: none;
      animation: fishSwim 36.8s ease-in-out infinite alternate;
      animation-delay: -14s;        /* stagger where each fish starts */
    }

    /* Only the linked fish is interactive */
    a.soul-fish { pointer-events: auto; cursor: pointer; }

    .soul-fish img {
      display: block;
      width: 100%;
      height: auto;
      /* steps(1) snaps the flip instantly instead of easing through it */
      animation: fishFlip 73.6s steps(1, end) infinite;
      animation-delay: -14s;
    }

    .fish-lane--left .soul-fish {
      offset-path: path("M 0,50 C 50,10 90,90 140,50 C 165,30 180,65 195,50");
    }
    /* Sets off rightward, so its flip phase is inverted */
    .fish-lane--left .soul-fish img { animation-name: fishFlipReverse; }

    .fish-lane--right .soul-fish {
      offset-path: path("M 195,45 C 145,5 105,85 55,45 C 30,25 15,60 0,45");
      animation-duration: 30.4s;
      animation-delay: -25s;
    }
    .fish-lane--right .soul-fish img {
      animation-duration: 60.8s;
      animation-delay: -25s;
    }

    .fish-lane--right2 .soul-fish {
      offset-path: path("M 185,40 C 140,75 95,10 55,45 C 30,65 15,25 0,40");
      animation-duration: 34s;
      animation-delay: -8s;
    }
    .fish-lane--right2 .soul-fish img {
      animation-duration: 68s;
      animation-delay: -8s;
    }

    /* Fish / boat fill: the img's own picture is pushed out of its box and its
       background, masked by that same PNG (--fill-png, set in JS), shows the
       shape in --fish-colour / --boat-colour. Each is off while transparent. */
    .fish-coloured .soul-fish img,
    .boat-coloured .wave-boat img {
      object-position: 0 -100000px;
      -webkit-mask: var(--fill-png) center / contain no-repeat;
      mask: var(--fill-png) center / contain no-repeat;
    }
    .fish-coloured .soul-fish img { background: var(--fish-colour); }
    .boat-coloured .wave-boat img { background: var(--boat-colour); }

    @keyframes fishSwim {
      from { offset-distance: 0%; }
      to   { offset-distance: 100%; }
    }

    /* Instant flip at each turnaround. The art faces left, so fishFlip suits a
       fish that sets off leftward; the left fish sets off rightward, so it uses
       the inverted phase. */
    @keyframes fishFlip {
      0%   { transform: scaleX(1); }
      50%  { transform: scaleX(-1); }
      100% { transform: scaleX(1); }
    }

    @keyframes fishFlipReverse {
      0%   { transform: scaleX(-1); }
      50%  { transform: scaleX(1); }
      100% { transform: scaleX(-1); }
    }

    /* Below ~1320px there are no side margins, so anchor the lanes to the
       viewport edges instead of the column, with shorter paths. Lane width is
       set to the exact path extent (path width + fish width) so the fish can
       never swim past the screen edge. */
    @media (max-width: 1320px) {
      .fish-lane { width: 161px; height: 90px; }

      .fish-lane--left   { left: 2vw;  right: auto; top: 30vh; }
      .fish-lane--right  { left: auto; right: 2vw;  top: 48vh; }
      .fish-lane--right2 { left: auto; right: 2vw;  top: 66vh; }

      .soul-fish { width: var(--fish-size-phone); }

      .fish-lane--left .soul-fish {
        offset-path: path("M 0,45 C 30,12 60,78 90,45 C 108,28 122,58 135,45");
      }
      .fish-lane--right .soul-fish {
        offset-path: path("M 135,40 C 105,7 75,73 45,40 C 27,22 13,52 0,40");
      }
      .fish-lane--right2 .soul-fish {
        offset-path: path("M 135,40 C 100,70 65,10 35,45 C 22,58 10,25 0,40");
      }
    }

    .contact-link {
      position: absolute;
      top: 3.5rem;
      right: 8.4rem;
      z-index: 2;                 /* mail hand in front of the wave and the boat */
      color: #000;
      text-decoration: none;
      font-size: 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    /* Under the mouse the white fill turns --contact-hover-colour (the fill span
       sits over the white PNG, so this shows whether or not that's coloured) */
    .contact-link:hover .pbox-white-fill { background: var(--contact-hover-colour); }

    /* Three-part mail hand like the box logos: white fill, shading, linework */
    .contact-icon {
      display: block;
      position: relative;
      width: var(--mail-size);
      aspect-ratio: 716 / 980;
    }
    .contact-icon img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .contact-icon img:nth-of-type(2) { opacity: 0.5; }   /* shading layer */

    /* Phone: mirrors the mail hand on the left; calls --phone-number.
       Phones dial straight away; computers open the card underneath. */
    .phone-contact {
      position: absolute;
      top: 3.5rem;
      left: 8.4rem;
      z-index: 2;
    }
    .phone-contact .contact-link { position: static; }
    .phone-contact .contact-icon { width: var(--phone-size); aspect-ratio: 594 / 1044; }
    .phone-card {
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.7rem 0.9rem;
      background: var(--box-colour);
      border: var(--box-line) solid var(--box-line-colour);
      border-radius: var(--box-corner);
      color: var(--box-text-colour);
      font-size: 1.3rem;
      white-space: nowrap;
      text-align: left;
    }
    .phone-card[hidden] { display: none; }
    .phone-card-number { user-select: all; }
    .phone-card-actions { display: flex; gap: 0.5rem; }
    .phone-card-actions a,
    .phone-card-actions button {
      flex: 1;
      padding: 0.25rem 0.7rem;
      font: inherit;
      font-size: 1.1rem;
      color: inherit;
      text-align: center;
      text-decoration: none;
      background: transparent;
      border: 2px solid var(--box-line-colour);
      border-radius: calc(var(--box-corner) / 2);
      cursor: pointer;
    }
    .phone-card-actions a:hover,
    .phone-card-actions button:hover { background: var(--box-hover-colour); }

    body {
      background: var(--page-colour);
      color: #000;
      font-family: 'NomKabarFont2', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      padding: 1.5rem 1.5rem 2rem;
      text-align: center;
      transition: background-color 0.35s ease;
    }

    /* Permanent "water": darker shade + repeating grid, always present below the
       wavy line. Masked to a wavy top edge; the opaque header covers the rest. */
    .water {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-color: var(--water-colour);
      -webkit-mask-image: url("UnderWavesMaskImg.png"), linear-gradient(#000, #000);
      mask-image: url("UnderWavesMaskImg.png"), linear-gradient(#000, #000);
      -webkit-mask-size: var(--wave-tile) 32px, 100% 300vh;
      mask-size: var(--wave-tile) 32px, 100% 300vh;
      -webkit-mask-repeat: repeat-x, no-repeat;
      mask-repeat: repeat-x, no-repeat;
      -webkit-mask-position: 0 var(--waterline), 0 calc(var(--waterline) + 30px);
      mask-position: 0 var(--waterline), 0 calc(var(--waterline) + 30px);
      /* Scroll the wavy edge one tile in sync with the wave line (same --wave-tile / 8.6s) */
      animation: waterFlow 8.6s linear infinite;
    }

    @keyframes waterFlow {
      from {
        -webkit-mask-position: 0 var(--waterline), 0 calc(var(--waterline) + 30px);
        mask-position: 0 var(--waterline), 0 calc(var(--waterline) + 30px);
      }
      to {
        -webkit-mask-position: calc(-1 * var(--wave-tile)) var(--waterline), 0 calc(var(--waterline) + 30px);
        mask-position: calc(-1 * var(--wave-tile)) var(--waterline), 0 calc(var(--waterline) + 30px);
      }
    }

    /* Repeating 148px grid tile over the water colour */
    .water svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .water .drawn-line { stroke-width: var(--grid-line); stroke: var(--grid-line-colour); }

    /* City skyline repeating above the waves; masked out behind the centred title */
    .skyline {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(var(--waterline) + 32px);
      z-index: 0;
      pointer-events: none;
      -webkit-mask: linear-gradient(to right, #000 var(--sky-cut-l), transparent var(--sky-cut-l), transparent var(--sky-cut-r), #000 var(--sky-cut-r));
      mask: linear-gradient(to right, #000 var(--sky-cut-l), transparent var(--sky-cut-l), transparent var(--sky-cut-r), #000 var(--sky-cut-r));
    }
    /* One 43px-high tile repeating along the line, scaled by --sky-scale
       (stroke divided back up so it stays in px); setSkyline() puts the scale
       onto the pattern. Both layers run down past the wavy water edge so the
       steps can go below the skyline ground; --sky-drop = the skyline's 30px
       lift above the waterline + the 32px wave edge */
    .skyline {
      --sky-drop: 62px;
      --sky-scale: var(--skyline-scale);
      --sky-line: var(--skyline-line);
      --sky-cut-gap: var(--title-skyline-gap);
      --sky-step-width: var(--skyline-step-width);
      --sky-drop-shrink: var(--skyline-drop-shrink);
      --sky-steps: var(--skyline-steps);
      --sky-mid-height: var(--skyline-mid-height);
      --sky-title-height: var(--skyline-title-height);
    }
    .skyline svg { position: absolute; left: 0; bottom: var(--sky-drop); width: 100%; height: calc(43px * var(--sky-scale)); overflow: visible; }
    .skyline rect { fill: url(#skylineTile); }
    .skyline .drawn-line { stroke-width: calc(var(--sky-line) / var(--sky-scale)); stroke: var(--skyline-colour); }
    /* The steps down into the title gap are drawn in px, outside the scaled tile */
    .skyline .drawn-line.sky-steps { stroke-width: var(--sky-line); }
    /* Skyline fill: the same tile closed off underneath, on its own layer behind
       the water so it runs down under the wavy edge */
    .skyline-fill rect { fill: url(#skylineFillTile); }
    .skyline-fill path { fill: var(--skyline-fill-colour); }
    .skyline-fill::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(var(--sky-drop) + 1px);   /* 1px under the tile so no seam shows */
      /* only out to each wall: setSkySteps() fills under the steps itself */
      background: linear-gradient(to right, var(--skyline-fill-colour) var(--sky-fill-l, 100%), transparent var(--sky-fill-l, 100%), transparent var(--sky-fill-r, 100%), var(--skyline-fill-colour) var(--sky-fill-r, 100%));
    }

    .container {
      position: relative;
      max-width: 1120px;
      margin: 0 auto;
      min-height: calc(100vh - 3.5rem);
      padding-top: 11.5rem;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards;
      animation-delay: 0.2s;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .title {
      font-family: 'NomKabarFont2', sans-serif;
      font-weight: 400;
      font-size: clamp(var(--title-size-small), 3.29vw, var(--title-size-large));
      letter-spacing: 0.01em;
      line-height: 1.15;
      color: var(--title-colour);
      /* Outline drawn behind the fill, so the stroke is doubled to show at full width */
      --t-outline: var(--title-outline);
      -webkit-text-stroke: calc(var(--t-outline) * 2) var(--title-outline-colour);
      paint-order: stroke fill;
    }

    /* ---- Floating portfolio boxes ---- */
    .pboxes {
      position: relative;
      height: 70vh;
      max-height: 660px;
    }

    .pbox {
      position: absolute;
      width: calc(185px * var(--box-scale) * var(--own-scale, 1));
      height: calc(172px * var(--box-scale) * var(--own-scale, 1));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: var(--box-padding);
      background: var(--box-colour);
      border: var(--box-line) solid var(--box-line-colour);
      border-radius: var(--box-corner);
      cursor: pointer;
      color: var(--box-text-colour);
      font-family: 'NomKabarFont2', sans-serif;
      z-index: 3;
      /* float disabled 2026-09-22 — see disabled-effects/floating-boxes.css */
      transition: left .6s cubic-bezier(.6,.05,.25,1),
                  top .6s cubic-bezier(.6,.05,.25,1),
                  width .6s cubic-bezier(.6,.05,.25,1),
                  height .6s cubic-bezier(.6,.05,.25,1),
                  box-shadow .3s ease, border-color .3s ease;
    }

    .pbox:hover { background: var(--box-hover-colour); }

    .pbox-title {
      font-size: var(--button-text);
      letter-spacing: 0.01em;
      text-align: center;
      transition: opacity .3s ease;
      pointer-events: none;
    }

    .pbox-icon {
      display: block;
      position: relative;
      width: var(--logo-size);
      aspect-ratio: 492 / 372;   /* the old single-image icons' canvas */
      pointer-events: none;
      transition: width .6s cubic-bezier(.6,.05,.25,1);
    }
    /* Three-part logos: white bg, shading, linework stacked in that order */
    .pbox-icon img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .pbox-icon img:nth-of-type(2) { opacity: 0.5; }   /* shading layer */
    /* Shading colour fill: the shading PNG's shape filled with --logo-shading-colour
       (span added after each shading img in JS). Off while that colour is transparent. */
    .pbox-shading-fill {
      position: absolute;
      inset: 0;
      background: var(--logo-shading-colour);
      -webkit-mask: var(--shading-png) center / contain no-repeat;
      mask: var(--shading-png) center / contain no-repeat;
    }
    .shading-coloured .pbox-icon img:nth-of-type(2),
    .shading-coloured .contact-icon img:nth-of-type(2) { opacity: 0; }   /* the fill replaces the grey shading */
    /* White fill colour: same idea for the white bg PNG, filled with --logo-white-colour */
    .pbox-white-fill {
      position: absolute;
      inset: 0;
      background: var(--logo-white-colour);
      -webkit-mask: var(--white-png) center / contain no-repeat;
      mask: var(--white-png) center / contain no-repeat;
    }
    .white-coloured .pbox-icon img:nth-of-type(1),
    .white-coloured .contact-icon img:nth-of-type(1) { opacity: 0; }   /* the fill replaces the white */

    /* Resting: placed by the --box-*-x / -y values (x = box centre, y = box top), sized by its own --box-*-scale */
    .pbox--illustration  { --own-scale: var(--box-illustration-scale); --own-scale-phone: var(--box-illustration-scale-phone); left: calc(var(--box-illustration-x) - 92px * var(--box-scale) * var(--own-scale));  top: var(--box-illustration-y); }
    .pbox--experimental  { --own-scale: var(--box-experimental-scale); --own-scale-phone: var(--box-experimental-scale-phone); left: calc(var(--box-experimental-x) - 92px * var(--box-scale) * var(--own-scale));  top: var(--box-experimental-y); }
    .pbox--storyboarding { --own-scale: var(--box-storyboarding-scale); --own-scale-phone: var(--box-storyboarding-scale-phone); left: calc(var(--box-storyboarding-x) - 92px * var(--box-scale) * var(--own-scale)); top: var(--box-storyboarding-y); }
    .pbox--showreel      { --own-scale: var(--box-showreel-scale); --own-scale-phone: var(--box-showreel-scale-phone); left: calc(var(--box-showreel-x) - 92px * var(--box-scale) * var(--own-scale));      top: var(--box-showreel-y); }
    .pbox--drawings      { --own-scale: var(--box-drawings-scale); --own-scale-phone: var(--box-drawings-scale-phone); left: calc(var(--box-drawings-x) - 92px * var(--box-scale) * var(--own-scale));      top: var(--box-drawings-y); }

    /* ---- Open state: boxes tighten to icons and dock left, viewer opens ---- */
    .container.is-open .pbox {
      width: 152px;
      height: 112px;
      gap: 0;
      animation: none;
      transform: none;
    }
    /* Collapse the title out of flow so the icon centres */
    .container.is-open .pbox-title { opacity: 0; height: 0; margin: 0; overflow: hidden; }
    .container.is-open .pbox-icon { width: var(--logo-size-open); }

    .container.is-open .pbox--illustration  { left: 0; top: 1%; }
    .container.is-open .pbox--experimental  { left: 0; top: 20.5%; }
    .container.is-open .pbox--storyboarding { left: 0; top: 40%; }
    .container.is-open .pbox--showreel      { left: 0; top: 59.5%; }
    .container.is-open .pbox--drawings      { left: 0; top: 79%; }

    .pbox.is-active { background: var(--box-active-colour); }

    /* ---- Viewer panel ---- */
    .viewer {
      position: absolute;
      top: 1%;
      left: 172px;
      right: 0;
      height: calc(70vh - 14px);
      max-height: 650px;
      background: var(--viewer-colour);
      border: var(--viewer-line) solid var(--viewer-line-colour);
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none;
      transition: opacity .4s ease, transform .4s ease;
      z-index: 120;               /* above the fixed header so the outside-X shows */
    }
    .container.is-open .viewer {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .viewer-close {
      position: absolute;
      top: -6px;
      right: -40px;
      font-size: 1.9rem;
      font-weight: 700;
      line-height: 1;
      color: var(--viewer-close-colour);
      pointer-events: none;   /* decorative only; closing is via click-outside */
    }

    .viewer-body { width: 100%; height: 100%; overflow: hidden; }
    .viewer-body .pdf-frame { width: 100%; height: 100%; border: none; border-radius: 0; }

    /* Drawings: a self-contained vertical scroll area of images */
    .viewer-body .gallery {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--gallery-colour);
      padding: 14px;
      text-align: center;
    }
    .viewer-body .gallery img {
      display: block;
      width: 100%;
      max-width: 640px;
      height: auto;
      margin: 0 auto 14px;
    }
    .viewer-body .gallery img:last-child { margin-bottom: 0; }
    .viewer-body .video-wrap { position: absolute; inset: 0; height: 100%; padding: 0; border: none; border-radius: 0; }
    /* Inside a scrolling gallery the video and PDF stack above the images */
    .viewer-body .gallery .video-wrap { position: relative; inset: auto; height: 0; padding-bottom: 56.25%; margin-bottom: 14px; }
    .viewer-body .gallery .pdf-frame { margin-bottom: 14px; }
    .viewer-body .gallery > :last-child { margin-bottom: 0; }

    .pdf-wrapper {
      position: relative;
    }

    .pdf-frame {
      width: 100%;
      height: 70vh;
      border: 1px solid #d8d5d0;
      border-radius: 4px;
      background: var(--pdf-colour);
      display: block;
    }

    .fullscreen-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255,255,255,0.9);
      border: 1px solid #d8d5d0;
      border-radius: 4px;
      padding: 5px 9px;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      color: #000;
      font-family: 'NomKabarFont2', sans-serif;
      transition: background 0.2s;
    }

    .fullscreen-btn:hover { background: #fff; }

    .video-wrap {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #d8d5d0;
    }

    .video-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    footer {
      margin-top: 1.25rem;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--footer-colour);
      text-transform: uppercase;
    }

    /* Tablet / phone: scattered boxes don't fit, so stack them */
    @media (max-width: 900px) {
      .container { padding-top: calc(var(--waterline) + 34px); }   /* clear the wave + gap */
      .pboxes {
        position: relative;
        height: auto;
        max-height: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.7vh;
        padding-bottom: 0.3rem;
      }
      .pbox {
        position: relative;   /* keeps flow layout but allows the left offsets */
        height: calc(min(122px, 15vh) * var(--box-scale-phone) * var(--own-scale-phone, 1));   /* smaller so five boxes fit the column */
        aspect-ratio: 185 / 172;   /* keep the desktop box proportions */
        width: auto;
        padding: var(--box-padding-phone);
        border-width: var(--box-line-phone);
        border-radius: var(--box-corner-phone);
      }
      .pbox-icon { width: min(var(--logo-size-phone), 10.5vh); }   /* scales so it never overflows the box */
      .pbox-title { font-size: var(--button-text-phone); }
      .wave-boat { width: var(--boat-size-phone); }
      /* Much smaller skyline on phones, raised higher */
      .skyline {
        --sky-drop: 52px;   /* 20px lift + 32px wave edge */
        --sky-scale: var(--skyline-scale-phone);
        --sky-line: var(--skyline-line-phone);
        --sky-cut-gap: var(--title-skyline-gap-phone);
        --sky-step-width: var(--skyline-step-width-phone);
        --sky-drop-shrink: var(--skyline-drop-shrink-phone);
        --sky-steps: var(--skyline-steps-phone);
        --sky-mid-height: var(--skyline-mid-height-phone);
        --sky-title-height: var(--skyline-title-height-phone);
      }
      .title { --t-outline: var(--title-outline-phone); }
      .wave-line .drawn-line { stroke-width: var(--wave-line-phone); }
      .water .drawn-line { stroke-width: var(--grid-line-phone); }
      /* Closed: placed freely by the --box-*-x-phone / -y-phone values (x = box centre,
         y = box top) in an area the height of the old five-box column */
      .container:not(.is-open) .pboxes {
        display: block;
        height: calc(5 * min(122px, 15vh) * var(--box-scale-phone) + 2.8vh + 0.3rem);
      }
      .container:not(.is-open) .pbox { position: absolute; transform: translateX(-50%); }
      .container:not(.is-open) .pbox--illustration  { left: var(--box-illustration-x-phone);  top: var(--box-illustration-y-phone); }
      .container:not(.is-open) .pbox--experimental  { left: var(--box-experimental-x-phone);  top: var(--box-experimental-y-phone); }
      .container:not(.is-open) .pbox--storyboarding { left: var(--box-storyboarding-x-phone); top: var(--box-storyboarding-y-phone); }
      .container:not(.is-open) .pbox--showreel      { left: var(--box-showreel-x-phone);      top: var(--box-showreel-y-phone); }
      .container:not(.is-open) .pbox--drawings      { left: var(--box-drawings-x-phone);      top: var(--box-drawings-y-phone); }

      /* Open: the four icons sit in a fixed single row ABOVE the viewer */
      .container.is-open .pboxes {
        position: fixed;
        top: calc(var(--waterline) + 16px);
        left: 0;
        right: 0;
        height: auto;
        flex-direction: row;
        flex-wrap: nowrap;
        justify-content: center;
        align-items: flex-start;
        gap: 8px;
        padding: 0;
        z-index: 61;
      }
      .container.is-open .pbox {
        width: 64px;
        height: auto;            /* aspect-ratio keeps the proportion */
      }
      .container.is-open .pbox-icon { width: var(--logo-size-open-phone); }

      .viewer {
        position: fixed;
        left: 4vw;
        right: 13vw;   /* leave room for the X just outside the right edge */
        top: calc(var(--waterline) + 96px);   /* below the icon row, leaving a gap */
        bottom: 3vh;
        height: auto;
        max-height: none;
        z-index: 60;
        border-width: var(--viewer-line-phone);
      }
      /* On phones the X sits just outside the viewer's top-right */
      .viewer-close { top: -2px; right: -32px; }
    }

    @media (max-width: 480px) {
      body { padding: 1rem 1rem 0.75rem; }
      .fixed-header { padding: 1.2rem 1rem 1rem; }
      .contact-link { top: 1.2rem; right: 1.2rem; }
      .contact-icon { width: var(--mail-size-phone); }
      .phone-contact { top: 1.2rem; left: 1.2rem; }
      .phone-contact .contact-icon { width: var(--phone-size-phone); }
    }
  </style>
</head>

  <script>
    const isMobile = window.innerWidth <= 768;
    const baseUrl = window.location.href.replace(/\/[^/]*$/, '/');

    const SECTIONS = {
      illustration:  { type: 'pdf',   file: 'ArtAndIllustrationFolio.pdf', title: 'Art & Illustration Portfolio' },
      experimental:  { type: 'gallery', video: 'https://www.youtube.com/embed/a1LGS7IE8gc', pdf: 'ExperimentalFolio1.pdf', images: [], title: 'Experimental Portfolio' },
      storyboarding: { type: 'pdf',   file: 'StoryboardFolio.pdf',         title: 'Storyboarding Portfolio' },
      showreel:      { type: 'video', file: 'https://www.youtube.com/embed/frCgh0a3msg', title: 'Game Art Show Reel' },
      drawings:      { type: 'gallery', images: ['drawings/Scan_20260805.jpg', 'drawings/Scan_20260806.jpg'], title: 'Drawings' }
    };

    const stage = document.getElementById('stage');
    const viewerBody = document.querySelector('.viewer-body');

    function getPdfSrc(filename) {
      if (isMobile) {
        return 'https://docs.google.com/viewer?url=' + encodeURIComponent(baseUrl + filename) + '&embedded=true';
      }
      return filename;
    }

    function loadViewer(id) {
      const s = SECTIONS[id];
      if (!s) return;
      if (s.type === 'pdf') {
        viewerBody.innerHTML =
          '<iframe class="pdf-frame" src="' + getPdfSrc(s.file) + '" title="' + s.title + '"></iframe>';
      } else if (s.type === 'gallery') {
        // Optional video, then optional PDF, then the images, all in one scroll
        viewerBody.innerHTML =
          '<div class="gallery">' +
          (s.video ? '<div class="video-wrap"><iframe src="' + s.video + '" title="' + s.title + '" allowfullscreen></iframe></div>' : '') +
          (s.pdf ? '<iframe class="pdf-frame" src="' + getPdfSrc(s.pdf) + '" title="' + s.title + '"></iframe>' : '') +
          s.images.map(function (src) { return '<img src="' + src + '" alt="">'; }).join('') +
          '</div>';
      } else {
        viewerBody.innerHTML =
          '<div class="video-wrap"><iframe src="' + s.file + '" title="' + s.title + '" allowfullscreen></iframe></div>';
      }
    }

    function openSection(id) {
      if (!SECTIONS[id]) return;
      loadViewer(id);
      stage.classList.add('is-open');
      document.body.classList.add('panel-open');
      document.querySelectorAll('.pbox').forEach(b =>
        b.classList.toggle('is-active', b.dataset.id === id));
    }

    function closeViewer() {
      stage.classList.remove('is-open');
      document.body.classList.remove('panel-open');
      document.querySelectorAll('.pbox').forEach(b => b.classList.remove('is-active'));
      // clear content (stops the video) once the close animation has played
      setTimeout(() => { if (!stage.classList.contains('is-open')) viewerBody.innerHTML = ''; }, 450);
    }

    // A box opens (or, while open, switches to) its section
    document.querySelectorAll('.pbox').forEach(box => {
      box.addEventListener('click', () => openSection(box.dataset.id));
    });

    // Click anywhere outside the viewer/boxes (and not on a link) closes it.
    // The X is decorative; this is what actually closes.
    document.addEventListener('click', function (e) {
      if (!stage.classList.contains('is-open')) return;
      if (e.target.closest('.viewer') ||
          e.target.closest('.pbox') ||
          e.target.closest('a')) {
        return;
      }
      closeViewer();
    });

    // Keep the wavy waterline pinned to the actual header height (raised by
    // --wave-raise), so the water edge meets the wave line at every window width.
    let skyCut = null;   // title gap edges in px, for setSkySteps()
    function setWaterline() {
      const h = document.querySelector('.fixed-header').getBoundingClientRect().bottom;
      const raise = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--wave-raise')) || 0;
      document.documentElement.style.setProperty('--waterline', Math.round(h - 15 - raise) + 'px');
      // Keep the skyline cut-out tight to the actual title TEXT width (the h1 is
      // full-width, so measure the text with a Range instead of the element box)
      const range = document.createRange();
      range.selectNodeContents(document.querySelector('.title'));
      const rects = [...range.getClientRects()];
      if (rects.length) {
        const vw = window.innerWidth || document.documentElement.clientWidth;
        // A minus gap brings the skyline in over the title, up to its centre
        const gap = parseFloat(getComputedStyle(document.querySelector('.skyline')).getPropertyValue('--sky-cut-gap')) || 0;
        const left = Math.min(...rects.map(r => r.left));
        const right = Math.max(...rects.map(r => r.right));
        const centre = (left + right) / 2;
        const cutL = Math.min(centre, left - gap), cutR = Math.max(centre, right + gap);
        const l = Math.max(0, cutL / vw * 100);
        const r = Math.min(100, cutR / vw * 100);
        document.documentElement.style.setProperty('--sky-cut-l', l.toFixed(1) + '%');
        document.documentElement.style.setProperty('--sky-cut-r', r.toFixed(1) + '%');
        skyCut = { l: cutL, r: cutR };
        setSkySteps();
      }
    }
    setWaterline();
    window.addEventListener('resize', setWaterline);
    // ResizeObserver catches the header reflow when the web font finishes loading,
    // at any window width — keeping the waterline glued to the wave line.
    if (window.ResizeObserver) {
      new ResizeObserver(setWaterline).observe(document.querySelector('.fixed-header'));
    }

    // Wave repeat: pattern width isn't CSS, so stretch the drawn 320px wave
    // across --wave-tile (x coordinates only, so the line keeps its thickness)
    const waveTile = document.getElementById('waveTile');
    const waveD = waveTile.querySelector('path').getAttribute('d');
    let waveWidth = 0;
    function setWaveRepeat() {
      const w = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--wave-tile')) || 320;
      if (w === waveWidth) return;
      waveWidth = w;
      let i = 0;
      waveTile.setAttribute('width', w);
      waveTile.querySelector('path').setAttribute('d',
        waveD.replace(/-?[\d.]+/g, n => (i++ % 2 ? n : String(+(parseFloat(n) * w / 320).toFixed(2)))));
    }
    setWaveRepeat();
    window.addEventListener('resize', setWaveRepeat);   // web <-> phone value

    // Skyline scale: pattern size isn't CSS, so copy --sky-scale onto the tile
    function setSkyline() {
      const css = getComputedStyle(document.querySelector('.skyline'));
      const scale = parseFloat(css.getPropertyValue('--sky-scale')) || 1;
      for (const id of ['skylineTile', 'skylineFillTile']) {
        document.getElementById(id).setAttribute('patternTransform', 'scale(' + scale + ')');
      }
      setSkySteps();
    }

    // Steps down into the title gap: either side the skyline stops at a tall
    // building's wall and drops to --sky-mid-height (a flat roof out to where
    // the steps begin), then --sky-steps steps, each --sky-step-width wide,
    // come down to --sky-title-height, each drop --sky-drop-shrink x the last
    // one. The last step ends at the gap round the title, where it drops to
    // the ground (or, below the ground, runs on flat into the gap).
    // Heights are px above the skyline's ground line.
    function setSkySteps() {
      if (!skyCut) return;
      const css = getComputedStyle(document.querySelector('.skyline'));
      const scale = parseFloat(css.getPropertyValue('--sky-scale')) || 1;
      const line = Math.max(0, parseFloat(css.getPropertyValue('--sky-line')) || 0);
      const stepWidth = Math.max(0, parseFloat(css.getPropertyValue('--sky-step-width')) || 0);
      const dropShrink = Math.max(0.05, parseFloat(css.getPropertyValue('--sky-drop-shrink')) || 1);
      const count = Math.max(0, Math.round(parseFloat(css.getPropertyValue('--sky-steps')) || 0));
      const midHeight = Math.max(0, parseFloat(css.getPropertyValue('--sky-mid-height')) || 0);
      const titleHeight = parseFloat(css.getPropertyValue('--sky-title-height')) || 0;
      const tile = 184.11 * scale;                    // one repeat, px
      const ground = 34.62 * scale;
      const bottom = 43 * scale;
      const svgWidth = document.querySelector('.skyline svg').getBoundingClientRect().width;
      // Tall buildings' top corners in the tile: right-hand corners end the left
      // side's skyline, left-hand corners end the right side's
      const tallRight = [[30.18, 7.65], [80.14, 6.74], [129.48, 6.19], [174.74, 6.62]];
      const tallLeft = [[16.11, 7.61], [62.77, 5.47], [112.2, 6.02], [160.84, 7.62]];
      const corners = (list, near) => {
        const k = Math.floor(near / tile);
        return [k - 1, k, k + 1].flatMap(n => list.map(([x, y]) => [n * tile + x * scale, y * scale]));
      };
      const run = count * stepWidth;
      // The steps end a line's width inside the gap edge so the last drop isn't
      // clipped; the wall is the nearest tall building leaving at least one step
      // width of mid-height roof before the steps
      const endL = skyCut.l - line, endR = skyCut.r + line;
      const reach = run + stepWidth;
      const wallL = corners(tallRight, endL - reach).filter(c => c[0] <= endL - reach).reduce((a, b) => b[0] > a[0] ? b : a);
      const wallR = corners(tallLeft, endR + reach).filter(c => c[0] >= endR + reach).reduce((a, b) => b[0] < a[0] ? b : a);
      // dir +1 runs right (left side), -1 runs left (right side). The drops
      // share mid height - title height between them: under 1 they get
      // smaller towards the title, over 1 bigger.
      const drops = [];
      for (let i = 0; i < count; i++) drops.push(Math.pow(dropShrink, i));
      const dropTotal = drops.reduce((a, b) => a + b, 0) || 1;
      const steps = (wall, dir, end) => {
        let x = wall[0], y = ground - midHeight;
        let d = 'M' + x.toFixed(2) + ' ' + wall[1].toFixed(2) + ' V' + y.toFixed(2);
        x = end - dir * run;   // the mid-height roof runs out to the first step
        d += ' H' + x.toFixed(2);
        drops.forEach(drop => {
          y += (midHeight - titleHeight) * drop / dropTotal;
          d += ' V' + y.toFixed(2);
          x += dir * stepWidth;
          d += ' H' + x.toFixed(2);
        });
        if (titleHeight >= 0) d += ' V' + ground.toFixed(2);
        return d + ' H' + (end + dir * (line + 2)).toFixed(2);
      };
      const left = steps(wallL, 1, endL);
      const right = steps(wallR, -1, endR);
      document.getElementById('skylineSteps').setAttribute('d', left + ' ' + right);
      // The steps' fill runs right down the fill layer (past the wave edge),
      // and the layer's band under the tile stops at each wall
      const drop = parseFloat(css.getPropertyValue('--sky-drop')) || 0;
      const floor = Math.max(bottom + drop + 1, ground - titleHeight);
      const close = (d, wall) => d + ' V' + floor.toFixed(2) + ' H' + wall[0].toFixed(2) + ' Z';
      document.getElementById('skylineFillSteps').setAttribute('d', close(left, wallL) + ' ' + close(right, wallR));
      const fillLayer = document.querySelector('.skyline-fill');
      fillLayer.style.setProperty('--sky-fill-l', (wallL[0] + 0.5).toFixed(2) + 'px');
      fillLayer.style.setProperty('--sky-fill-r', (wallR[0] - 0.5).toFixed(2) + 'px');
      // The repeating tile only up to each wall (fill overlaps 0.5px so no seam)
      const place = (id, x0, x1) => {
        const rect = document.getElementById(id);
        rect.setAttribute('x', Math.max(0, x0).toFixed(2));
        rect.setAttribute('width', Math.max(0, x1 - Math.max(0, x0)).toFixed(2));
      };
      place('skylineLeft', 0, wallL[0]);
      place('skylineRight', wallR[0], svgWidth);
      place('skylineFillLeft', 0, wallL[0] + 0.5);
      place('skylineFillRight', wallR[0] - 0.5, svgWidth);
    }
    setSkyline();
    window.addEventListener('resize', setSkyline);

    // Logo shading colour fill: a span masked by each shading PNG. While
    // --logo-shading-colour is transparent the grey PNG shading shows as before.
    for (const img of document.querySelectorAll('.pbox-icon img:nth-of-type(2), .contact-icon img:nth-of-type(2)')) {
      const fill = document.createElement('span');
      fill.className = 'pbox-shading-fill';
      fill.style.setProperty('--shading-png', 'url("' + img.src + '")');
      img.after(fill);
    }
    // Logo white fill: the same for each white bg PNG with --logo-white-colour
    for (const img of document.querySelectorAll('.pbox-icon img:nth-of-type(1), .contact-icon img:nth-of-type(1)')) {
      const fill = document.createElement('span');
      fill.className = 'pbox-white-fill';
      fill.style.setProperty('--white-png', 'url("' + img.src + '")');
      img.after(fill);
    }
    function setFillClass(selector, className) {
      const fill = document.querySelector(selector);
      const colour = fill ? getComputedStyle(fill).backgroundColor : '';
      const off = !colour || colour === 'transparent' || /^rgba\(.*,\s*0\)$/.test(colour);
      document.documentElement.classList.toggle(className, !off);
    }
    // Soul fish / boat fill: each img masked by its own PNG (see .fish-coloured)
    for (const img of document.querySelectorAll('.soul-fish img, .wave-boat img')) {
      img.style.setProperty('--fill-png', 'url("' + img.src + '")');
    }
    function setShadingFill() {
      setFillClass('.pbox-shading-fill', 'shading-coloured');
      setFillClass('.pbox-white-fill', 'white-coloured');
      for (const name of ['fish', 'boat']) {
        const colour = getComputedStyle(document.documentElement).getPropertyValue('--' + name + '-colour').trim();
        document.documentElement.classList.toggle(name + '-coloured', !!colour && colour !== 'transparent');
      }
    }
    setShadingFill();

    // Phone: the number lives in --phone-number. On a phone (touch, no hover)
    // the tel: link dials as normal; on a computer the click opens a card with
    // the number, Call (whatever calling app the computer has) and Copy.
    const phoneLink = document.getElementById('phoneLink');
    const phoneCard = document.getElementById('phoneCard');
    function setPhone() {
      const number = getComputedStyle(document.documentElement).getPropertyValue('--phone-number').trim().replace(/^["']|["']$/g, '');
      const tel = 'tel:' + number.replace(/[^\d+]/g, '');
      phoneLink.href = tel;
      document.getElementById('phoneCall').href = tel;
      document.getElementById('phoneNumber').textContent = number;
    }
    setPhone();
    phoneLink.addEventListener('click', e => {
      if (matchMedia('(hover: none) and (pointer: coarse)').matches) return;
      e.preventDefault();
      phoneCard.hidden = !phoneCard.hidden;
    });
    document.getElementById('phoneCopy').addEventListener('click', async e => {
      const button = e.currentTarget;
      try {
        await navigator.clipboard.writeText(document.getElementById('phoneNumber').textContent);
        button.textContent = 'Copied';
      } catch (err) {
        getSelection().selectAllChildren(document.getElementById('phoneNumber'));
        button.textContent = 'Press Ctrl+C';
      }
      setTimeout(() => { button.textContent = 'Copy'; }, 1500);
    });
    document.addEventListener('click', e => {
      if (!phoneCard.hidden && !e.target.closest('.phone-contact')) phoneCard.hidden = true;
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') phoneCard.hidden = true; });

    // The Website Tuner swaps the <style> text when a value changes
    new MutationObserver(() => { setWaveRepeat(); setWaterline(); setSkyline(); setShadingFill(); setPhone(); }).observe(document.head, { childList: true, characterData: true, subtree: true });
  </script>
