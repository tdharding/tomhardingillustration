<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <script>

    function gtag(){dataLayer.push(arguments);}

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tom Harding Illustration</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400&family=Source+Sans+3:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { overflow: hidden; }   /* no scrolling anywhere; everything fits the viewport */
    :root { --waterline: 150px; --sky-cut-l: 35%; --sky-cut-r: 65%; }   /* set from header/title in JS */

    .fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: transparent;   /* let the wavy water edge define the boundary */
      text-align: center;
      padding: 3.5rem 1.5rem 1.9rem;
      --tile: 320px;
    }

    .fixed-header::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(var(--tile) / 10);
      transform: translateY(50%);
      background-image: url("WaveyLine.png");
      background-repeat: repeat-x;
      background-position: 0 center;
      background-size: var(--tile) 100%;
      animation: waveFlow 8.6s linear infinite;
      pointer-events: none;
    }

    @keyframes waveFlow {
      from { background-position-x: 0; }
      to   { background-position-x: calc(-1 * var(--tile)); }
    }

    /* Easter-egg boat: sails right-to-left across the wave every so often */
    .wave-boat {
      position: absolute;
      bottom: -24px;
      left: 100%;
      width: 60px;
      pointer-events: none;
      z-index: 1;
      animation: boatSail 120s linear infinite;
      animation-delay: 6s;
    }

    /* Only the boat itself is clickable; the wrapper stays click-through */
    .wave-boat a {
      display: block;
      width: 100%;
      pointer-events: auto;
      cursor: pointer;
    }

    .wave-boat img {
      display: block;
      width: 100%;
      height: auto;
      transform-origin: 50% 85%;
      animation: boatRock 4s ease-in-out infinite;
    }

    /* Travel: crosses the screen in 40s, then rests off-screen for the rest of the cycle */
    @keyframes boatSail {
      0%    { transform: translateX(0); }
      33.3% { transform: translateX(calc(-100vw - 96px)); }
      100%  { transform: translateX(calc(-100vw - 96px)); }
    }

    /* Rock: tilts ~17.5deg up one side, then up the other */
    @keyframes boatRock {
      0%, 100% { transform: rotate(-17.5deg); }
      50%      { transform: rotate(17.5deg); }
    }

    /* Soul fish: swim winding routes in the margins either side of the column.
       Each lane is the containing block, so the motion path resolves inside it. */
    .fish-lane {
      position: absolute;
      width: 230px;
      height: 110px;
      z-index: 1;
      pointer-events: none;
      transition: transform 2.2s ease, opacity 2.2s ease;
    }

    /* When the viewer is open the fish disperse off-screen, and return on close */
    body.panel-open .fish-lane--left  { transform: translateX(-75vw); opacity: 0; }
    body.panel-open .fish-lane--right,
    body.panel-open .fish-lane--right2 { transform: translateX(75vw); opacity: 0; }

    .fish-lane--left   { left: calc(50% - 410px - 250px); top: 42vh; }
    .fish-lane--right  { left: calc(50% + 410px + 20px);  top: 34vh; }
    .fish-lane--right2 { left: calc(50% + 410px + 40px);  top: 58vh; }

    .soul-fish {
      position: absolute;
      top: 0;
      left: 0;
      width: 32px;
      offset-rotate: 0deg;          /* stay upright; don't tumble along the curve */
      pointer-events: none;
      animation: fishSwim 36.8s ease-in-out infinite alternate;
      animation-delay: -14s;        /* stagger where each fish starts */
    }

    /* Only the linked fish is interactive */
    a.soul-fish { pointer-events: auto; cursor: pointer; }

    .soul-fish img {
      display: block;
      width: 100%;
      height: auto;
      /* steps(1) snaps the flip instantly instead of easing through it */
      animation: fishFlip 73.6s steps(1, end) infinite;
      animation-delay: -14s;
    }

    .fish-lane--left .soul-fish {
      offset-path: path("M 0,50 C 50,10 90,90 140,50 C 165,30 180,65 195,50");
    }
    /* Sets off rightward, so its flip phase is inverted */
    .fish-lane--left .soul-fish img { animation-name: fishFlipReverse; }

    .fish-lane--right .soul-fish {
      offset-path: path("M 195,45 C 145,5 105,85 55,45 C 30,25 15,60 0,45");
      animation-duration: 30.4s;
      animation-delay: -25s;
    }
    .fish-lane--right .soul-fish img {
      animation-duration: 60.8s;
      animation-delay: -25s;
    }

    .fish-lane--right2 .soul-fish {
      offset-path: path("M 185,40 C 140,75 95,10 55,45 C 30,65 15,25 0,40");
      animation-duration: 34s;
      animation-delay: -8s;
    }
    .fish-lane--right2 .soul-fish img {
      animation-duration: 68s;
      animation-delay: -8s;
    }

    @keyframes fishSwim {
      from { offset-distance: 0%; }
      to   { offset-distance: 100%; }
    }

    /* Instant flip at each turnaround. The art faces left, so fishFlip suits a
       fish that sets off leftward; the left fish sets off rightward, so it uses
       the inverted phase. */
    @keyframes fishFlip {
      0%   { transform: scaleX(1); }
      50%  { transform: scaleX(-1); }
      100% { transform: scaleX(1); }
    }

    @keyframes fishFlipReverse {
      0%   { transform: scaleX(-1); }
      50%  { transform: scaleX(1); }
      100% { transform: scaleX(-1); }
    }

    /* Below ~1320px there are no side margins, so anchor the lanes to the
       viewport edges instead of the column, with shorter paths. Lane width is
       set to the exact path extent (path width + fish width) so the fish can
       never swim past the screen edge. */
    @media (max-width: 1320px) {
      .fish-lane { width: 161px; height: 90px; }

      .fish-lane--left   { left: 2vw;  right: auto; top: 30vh; }
      .fish-lane--right  { left: auto; right: 2vw;  top: 48vh; }
      .fish-lane--right2 { left: auto; right: 2vw;  top: 66vh; }

      .soul-fish { width: 26px; }

      .fish-lane--left .soul-fish {
        offset-path: path("M 0,45 C 30,12 60,78 90,45 C 108,28 122,58 135,45");
      }
      .fish-lane--right .soul-fish {
        offset-path: path("M 135,40 C 105,7 75,73 45,40 C 27,22 13,52 0,40");
      }
      .fish-lane--right2 .soul-fish {
        offset-path: path("M 135,40 C 100,70 65,10 35,45 C 22,58 10,25 0,40");
      }
    }

    .contact-link {
      position: absolute;
      top: 3.5rem;
      right: 8.4rem;
      z-index: 2;                 /* mail hand in front of the wave and the boat */
      color: #000;
      text-decoration: none;
      transition: opacity 0.2s ease;
      font-size: 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .contact-link:hover { opacity: 0.45; }

    .contact-link img {
      display: block;
      width: 108px;
      height: auto;
    }

    body {
      background: #f7f5f2;
      color: #000;
      font-family: 'Libre Baskerville', serif;
      font-weight: 300;
      min-height: 100vh;
      padding: 1.5rem 1.5rem 2rem;
      text-align: center;
      transition: background-color 0.35s ease;
    }

    /* Permanent "water": darker shade + repeating grid, always present below the
       wavy line. Masked to a wavy top edge; the opaque header covers the rest. */
    .water {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-color: #d5d0c7;
      background-image: url("gridbg.png");
      background-repeat: repeat;
      background-size: 148px 148px;
      -webkit-mask-image: url("UnderWavesMaskImg.png"), linear-gradient(#000, #000);
      mask-image: url("UnderWavesMaskImg.png"), linear-gradient(#000, #000);
      -webkit-mask-size: 320px 32px, 100% 300vh;
      mask-size: 320px 32px, 100% 300vh;
      -webkit-mask-repeat: repeat-x, no-repeat;
      mask-repeat: repeat-x, no-repeat;
      -webkit-mask-position: 0 var(--waterline), 0 calc(var(--waterline) + 30px);
      mask-position: 0 var(--waterline), 0 calc(var(--waterline) + 30px);
      /* Scroll the wavy edge one tile in sync with the wave line (same 320px / 8.6s) */
      animation: waterFlow 8.6s linear infinite;
    }

    @keyframes waterFlow {
      from {
        -webkit-mask-position: 0 var(--waterline), 0 calc(var(--waterline) + 30px);
        mask-position: 0 var(--waterline), 0 calc(var(--waterline) + 30px);
      }
      to {
        -webkit-mask-position: -320px var(--waterline), 0 calc(var(--waterline) + 30px);
        mask-position: -320px var(--waterline), 0 calc(var(--waterline) + 30px);
      }
    }

    /* City skyline repeating above the waves; masked out behind the centred title */
    .skyline {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(var(--waterline) - 30px);
      background: url("CitySkyLine1.png") repeat-x left bottom;
      background-size: auto 43px;
      z-index: 0;
      pointer-events: none;
      -webkit-mask: linear-gradient(to right, #000 var(--sky-cut-l), transparent var(--sky-cut-l), transparent var(--sky-cut-r), #000 var(--sky-cut-r));
      mask: linear-gradient(to right, #000 var(--sky-cut-l), transparent var(--sky-cut-l), transparent var(--sky-cut-r), #000 var(--sky-cut-r));
    }

    .container {
      position: relative;
      max-width: 1120px;
      margin: 0 auto;
      min-height: calc(100vh - 3.5rem);
      padding-top: 11.5rem;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards;
      animation-delay: 0.2s;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .title {
      font-family: 'Libre Baskerville', serif;
      font-weight: 400;
      font-size: clamp(1.045rem, 3.29vw, 2.17rem);
      letter-spacing: 0.01em;
      line-height: 1.15;
      color: #000;
    }

    /* ---- Floating portfolio boxes ---- */
    .pboxes {
      position: relative;
      height: 70vh;
      max-height: 660px;
    }

    .pbox {
      position: absolute;
      width: 185px;
      height: 172px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.8rem;
      background: #f7f5f2;
      border: 1.8px solid #1a1a1a;
      cursor: pointer;
      color: #000;
      font-family: 'Libre Baskerville', serif;
      z-index: 3;
      animation: floatBox 6s ease-in-out infinite;
      transition: left .6s cubic-bezier(.6,.05,.25,1),
                  top .6s cubic-bezier(.6,.05,.25,1),
                  width .6s cubic-bezier(.6,.05,.25,1),
                  height .6s cubic-bezier(.6,.05,.25,1),
                  box-shadow .3s ease, border-color .3s ease;
    }

    .pbox:hover { background: #efece6; }

    .pbox-title {
      font-size: 1.05rem;
      letter-spacing: 0.01em;
      text-align: center;
      transition: opacity .3s ease;
      pointer-events: none;
    }

    .pbox-icon {
      display: block;
      width: 120px;
      height: auto;
      pointer-events: none;
      transition: width .6s cubic-bezier(.6,.05,.25,1);
    }

    /* Resting: a loose cross/diamond. North & south sit near centre; east &
       west float within their side zones. */
    .pbox--experimental  { left: calc(50% - 92px);   top: 5%; }   /* north */
    .pbox--showreel      { left: calc(50% - 92px);   top: 60%; }  /* south */
    .pbox--illustration  { left: 13%;                top: 33%; }  /* west */
    .pbox--storyboarding { left: calc(87% - 185px);  top: 33%; }  /* east */

    .pbox:nth-of-type(2) { animation-delay: -1.5s; }
    .pbox:nth-of-type(3) { animation-delay: -3s; }
    .pbox:nth-of-type(4) { animation-delay: -4.5s; }

    @keyframes floatBox {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    /* ---- Open state: boxes tighten to icons and dock left, viewer opens ---- */
    .container.is-open .pbox {
      width: 182px;
      height: 140px;
      gap: 0;
      animation: none;
      transform: none;
    }
    /* Collapse the title out of flow so the icon centres */
    .container.is-open .pbox-title { opacity: 0; height: 0; margin: 0; overflow: hidden; }
    .container.is-open .pbox-icon { width: 146px; }

    .container.is-open .pbox--illustration  { left: 0; top: 2%; }
    .container.is-open .pbox--experimental  { left: 0; top: 26%; }
    .container.is-open .pbox--storyboarding { left: 0; top: 50%; }
    .container.is-open .pbox--showreel      { left: 0; top: 74%; }

    .pbox.is-active { background: #e7e3db; }

    /* ---- Viewer panel ---- */
    .viewer {
      position: absolute;
      top: 1%;
      left: 202px;
      right: 0;
      height: calc(70vh - 14px);
      max-height: 650px;
      background: #f7f5f2;
      border: 1.5px solid #1a1a1a;
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none;
      transition: opacity .4s ease, transform .4s ease;
      z-index: 120;               /* above the fixed header so the outside-X shows */
    }
    .container.is-open .viewer {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .viewer-close {
      position: absolute;
      top: -6px;
      right: -40px;
      font-size: 1.9rem;
      font-weight: 700;
      line-height: 1;
      color: #000;
      pointer-events: none;   /* decorative only; closing is via click-outside */
    }

    .viewer-body { width: 100%; height: 100%; overflow: hidden; }
    .viewer-body .pdf-frame { width: 100%; height: 100%; border: none; border-radius: 0; }
    .viewer-body .video-wrap { position: absolute; inset: 0; height: 100%; padding: 0; border: none; border-radius: 0; }

    .pdf-wrapper {
      position: relative;
    }

    .pdf-frame {
      width: 100%;
      height: 70vh;
      border: 1px solid #d8d5d0;
      border-radius: 4px;
      background: #fff;
      display: block;
    }

    .fullscreen-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255,255,255,0.9);
      border: 1px solid #d8d5d0;
      border-radius: 4px;
      padding: 5px 9px;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      color: #000;
      font-family: 'Libre Baskerville', serif;
      transition: background 0.2s;
    }

    .fullscreen-btn:hover { background: #fff; }

    .video-wrap {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #d8d5d0;
    }

    .video-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    footer {
      margin-top: 1.25rem;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: #aaa;
      text-transform: uppercase;
    }

    /* Tablet / phone: scattered boxes don't fit, so stack them */
    @media (max-width: 900px) {
      .container { padding-top: calc(var(--waterline) + 34px); }   /* clear the wave + gap */
      .pboxes {
        position: relative;
        height: auto;
        max-height: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.7vh;
        padding-bottom: 0.3rem;
      }
      .pbox {
        position: relative;   /* keeps flow layout but allows the left offsets */
        height: min(138px, 17vh);
        aspect-ratio: 185 / 172;   /* keep the desktop box proportions */
        width: auto;
        padding: 0.4rem;
        /* floatBox bob stays enabled (transform is free now) */
      }
      .pbox-icon { width: min(94px, 12.5vh); }   /* bigger, but scales so it never overflows the box */
      .pbox-title { font-size: 0.8rem; }
      /* Much smaller skyline on phones, raised higher */
      .skyline { background-size: auto 26px; height: calc(var(--waterline) - 20px); }
      /* Random horizontal offsets (via left, so transform stays free for the float) */
      .container:not(.is-open) .pbox--illustration  { left: -32px; }
      .container:not(.is-open) .pbox--experimental  { left: 28px; }
      .container:not(.is-open) .pbox--storyboarding { left: -14px; }
      .container:not(.is-open) .pbox--showreel      { left: 36px; }

      /* Open: the four icons sit in a fixed single row ABOVE the viewer */
      .container.is-open .pboxes {
        position: fixed;
        top: calc(var(--waterline) + 16px);
        left: 0;
        right: 0;
        height: auto;
        flex-direction: row;
        flex-wrap: nowrap;
        justify-content: center;
        align-items: flex-start;
        gap: 8px;
        padding: 0;
        z-index: 61;
      }
      .container.is-open .pbox {
        width: 74px;
        height: auto;            /* aspect-ratio keeps the proportion */
      }
      .container.is-open .pbox-icon { width: 58px; }

      .viewer {
        position: fixed;
        left: 4vw;
        right: 13vw;   /* leave room for the X just outside the right edge */
        top: calc(var(--waterline) + 96px);   /* below the icon row, leaving a gap */
        bottom: 3vh;
        height: auto;
        max-height: none;
        z-index: 60;
      }
      /* On phones the X sits just outside the viewer's top-right */
      .viewer-close { top: -2px; right: -32px; }
    }

    @media (max-width: 480px) {
      body { padding: 1rem 1rem 0.75rem; }
      .fixed-header { padding: 1.2rem 1rem 1rem; }
      .contact-link { top: 1.2rem; right: 1.2rem; }
      .contact-link img { width: 60px; }
    }
  </style>
</head>
<body>
  <div class="water" aria-hidden="true"></div>
  <div class="skyline" aria-hidden="true"></div>
<header class="fixed-header">
    <a class="contact-link" href="mailto:tom@tomhardingillustration.co.uk">
      <img src="MailImage1.png" alt="Email Tom Harding">
    </a>
    <h1 class="title">Tom Harding<br>Art &amp; Illustration</h1>
    <div class="wave-boat"><a href="boatimage20072026.jpeg" target="_blank" rel="noopener" aria-label="Open drawing"><img src="boat.png" alt=""></a></div>
  </header>

  <div class="container" id="stage">
    <div class="pboxes">

      <button class="pbox pbox--illustration" data-id="illustration">
        <span class="pbox-title">Illustration<br>Portfolio</span>
        <img class="pbox-icon" src="handDrawing1v2.png" alt="">
      </button>

      <button class="pbox pbox--experimental" data-id="experimental">
        <span class="pbox-title">Experimental<br>Portfolio</span>
        <img class="pbox-icon" src="experimentallogov2.png" alt="">
      </button>

      <button class="pbox pbox--storyboarding" data-id="storyboarding">
        <span class="pbox-title">Storyboarding<br>Portfolio</span>
        <img class="pbox-icon" src="StoryboardingLogo1.png" alt="">
      </button>

      <button class="pbox pbox--showreel" data-id="showreel">
        <span class="pbox-title">Game Art<br>Show Reel</span>
        <img class="pbox-icon" src="handsgamecontroller1v2.png" alt="">
      </button>

      <section class="viewer" aria-label="Portfolio viewer">
        <span class="viewer-close" aria-hidden="true">✕</span>
        <div class="viewer-body"></div>
      </section>

    </div>

    <footer>© 2026 Tom Harding</footer>
  </div>

  <div class="fish-lane fish-lane--left">
    <a class="soul-fish" href="https://www.youtube.com/watch?v=3yz73QUttMU" target="_blank" rel="noopener" aria-label="Soul fish video">
      <img src="SoulFishSwimming.png" alt="">
    </a>
  </div>
  <div class="fish-lane fish-lane--right">
    <a class="soul-fish" href="https://www.youtube.com/shorts/GI1-x4V5DaE" target="_blank" rel="noopener" aria-label="Soul fish video">
      <img src="SoulFishSwimming.png" alt="">
    </a>
  </div>
  <div class="fish-lane fish-lane--right2">
    <a class="soul-fish" href="https://tomharding.art" target="_blank" rel="noopener" aria-label="Tom Harding art">
      <img src="SoulFishSwimming.png" alt="">
    </a>
  </div>

  <script>
    const isMobile = window.innerWidth <= 768;
    const baseUrl = window.location.href.replace(/\/[^/]*$/, '/');

    const SECTIONS = {
      illustration:  { type: 'pdf',   file: 'ArtAndIllustrationFolio.pdf', title: 'Art & Illustration Portfolio' },
      experimental:  { type: 'pdf',   file: 'ExperimentalFolio1.pdf',      title: 'Experimental Portfolio' },
      storyboarding: { type: 'pdf',   file: 'StoryboardFolio.pdf',         title: 'Storyboarding Portfolio' },
      showreel:      { type: 'video', file: 'https://www.youtube.com/embed/frCgh0a3msg', title: 'Game Art Show Reel' }
    };

    const stage = document.getElementById('stage');
    const viewerBody = document.querySelector('.viewer-body');

    function getPdfSrc(filename) {
      if (isMobile) {
        return 'https://docs.google.com/viewer?url=' + encodeURIComponent(baseUrl + filename) + '&embedded=true';
      }
      return filename;
    }

    function loadViewer(id) {
      const s = SECTIONS[id];
      if (!s) return;
      if (s.type === 'pdf') {
        viewerBody.innerHTML =
          '<iframe class="pdf-frame" src="' + getPdfSrc(s.file) + '" title="' + s.title + '"></iframe>';
      } else {
        viewerBody.innerHTML =
          '<div class="video-wrap"><iframe src="' + s.file + '" title="' + s.title + '" allowfullscreen></iframe></div>';
      }
    }

    function openSection(id) {
      if (!SECTIONS[id]) return;
      loadViewer(id);
      stage.classList.add('is-open');
      document.body.classList.add('panel-open');
      document.querySelectorAll('.pbox').forEach(b =>
        b.classList.toggle('is-active', b.dataset.id === id));
    }

    function closeViewer() {
      stage.classList.remove('is-open');
      document.body.classList.remove('panel-open');
      document.querySelectorAll('.pbox').forEach(b => b.classList.remove('is-active'));
      // clear content (stops the video) once the close animation has played
      setTimeout(() => { if (!stage.classList.contains('is-open')) viewerBody.innerHTML = ''; }, 450);
    }

    // A box opens (or, while open, switches to) its section
    document.querySelectorAll('.pbox').forEach(box => {
      box.addEventListener('click', () => openSection(box.dataset.id));
    });

    // Click anywhere outside the viewer/boxes (and not on a link) closes it.
    // The X is decorative; this is what actually closes.
    document.addEventListener('click', function (e) {
      if (!stage.classList.contains('is-open')) return;
      if (e.target.closest('.viewer') ||
          e.target.closest('.pbox') ||
          e.target.closest('a')) {
        return;
      }
      closeViewer();
    });

    // Keep the wavy waterline pinned to the actual header height, so the water
    // edge meets the wave line at every window width.
    function setWaterline() {
      const h = document.querySelector('.fixed-header').getBoundingClientRect().bottom;
      document.documentElement.style.setProperty('--waterline', Math.round(h - 15) + 'px');
      // Keep the skyline cut-out tight to the actual title TEXT width (the h1 is
      // full-width, so measure the text with a Range instead of the element box)
      const range = document.createRange();
      range.selectNodeContents(document.querySelector('.title'));
      const rects = [...range.getClientRects()];
      if (rects.length) {
        const vw = window.innerWidth || document.documentElement.clientWidth;
        const left = Math.min(...rects.map(r => r.left));
        const right = Math.max(...rects.map(r => r.right));
        const l = Math.max(0, (left / vw * 100) - 2.5);
        const r = Math.min(100, (right / vw * 100) + 2.5);
        document.documentElement.style.setProperty('--sky-cut-l', l.toFixed(1) + '%');
        document.documentElement.style.setProperty('--sky-cut-r', r.toFixed(1) + '%');
      }
    }
    setWaterline();
    window.addEventListener('resize', setWaterline);
    // ResizeObserver catches the header reflow when the web font finishes loading,
    // at any window width — keeping the waterline glued to the wave line.
    if (window.ResizeObserver) {
      new ResizeObserver(setWaterline).observe(document.querySelector('.fixed-header'));
    }
  </script>
</body>
</html>
